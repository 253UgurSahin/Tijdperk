# Tijdelijk hulpmiddel tijdens de omzetting naar TypeScript (wordt weer verwijderd):
# installeert, maakt de code op met Prettier, past ESLint-fixes toe, draait alle controles
# en zet het resultaat (lockfile, opgemaakte code, rapporten, artifact-HTML) terug op de branch.
name: Werkbank

on:
  push:
    branches: [typescript]

permissions:
  contents: write

jobs:
  werkbank:
    if: ${{ !startsWith(github.event.head_commit.message, '[werkbank]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run format
      - run: mkdir -p werkbank
      - run: npx eslint src tests --fix > werkbank/lint.txt 2>&1 || true
      - run: npx prettier --check "src/**/*.{ts,css}" "tests/**/*.ts" > werkbank/prettier.txt 2>&1 || true
      - run: npx tsc > werkbank/tsc.txt 2>&1 || true
      - run: npx vitest run > werkbank/test.txt 2>&1 || true
      - run: npx vite build > werkbank/build.txt 2>&1 || true
      - run: (npm run build:artifact > werkbank/artifact.txt 2>&1 && cp dist-artifact/tijdperken.html werkbank/) || true
      - name: Resultaat terugzetten
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "[werkbank] opmaak, lockfile en rapporten" || echo "niets te doen"
          git push
