<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tijdperken</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>
<style>
/* Tijdperken — real-time strategy HUD over a WebGL world.
   Layout follows modern RTS convention: objectives top-left, age plate top-centre, menu top-right,
   and a fixed command bar along the bottom (resources · selection · command grid · minimap). */
:root{
  color-scheme:dark;
  --p0:#0e141e; --p1:#1b2434; --p2:#131b28; --p3:#0f1622;
  --panel:linear-gradient(180deg,#1d2738 0%,#141c2a 55%,#111823 100%);
  --line:rgba(208,178,112,.2); --line-2:rgba(208,178,112,.46); --gold:#d6b46c; --gold-2:#f0d796;
  --fg:#efe7d3; --fg-2:#d6cdb7; --muted:#b4bcc6; --faint:#9ca6b2;
  --accent:#d9a441; --accent-ink:#1b1305; --team:#3d7be0;
  --good:#8fd27a; --bad:#ef6a5a; --warn:#f0bf55;
  --soft:color-mix(in srgb,var(--accent) 20%,transparent);
  --f-display:'Cinzel','Trajan Pro',Georgia,serif;
  --f-body:'Instrument Sans',system-ui,-apple-system,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --barh:226px; --resw:214px;
}
body[data-age="1"]{--accent:#d08b3c} body[data-age="2"]{--accent:#d6705f} body[data-age="3"]{--accent:#8fb2c9} body[data-age="4"]{--accent:#a6c25c} body[data-age="5"]{--accent:#46d3d6}
html,body{height:100%;margin:0;background:#0d1219;color:var(--fg);font:13px/1.45 var(--f-body);overflow:hidden}
*{box-sizing:border-box}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;border:1px solid var(--line);background:rgba(255,255,255,.04);border-radius:4px;padding:7px 12px;min-height:32px;transition:border-color .15s,background .15s,color .15s,transform .08s}
button:hover:not(:disabled){border-color:var(--gold);background:rgba(214,180,108,.1)}
button:active:not(:disabled){transform:translateY(1px)}
button:disabled{opacity:.55;cursor:not-allowed}
button:focus-visible,canvas:focus-visible,input:focus-visible{outline:2px solid var(--gold-2);outline-offset:2px}
@media (pointer:coarse){button{min-height:44px}}
.quiet{background:transparent;border-color:transparent;color:var(--muted)}
.quiet:hover:not(:disabled){background:rgba(255,255,255,.06);border-color:transparent;color:var(--fg)}
.primary{background:linear-gradient(#e6c47c,#c69a48);border-color:#f3dca0;color:#1d1406;font-weight:700;box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
.primary:hover:not(:disabled){background:linear-gradient(#f0d28e,#d2a654);border-color:#fff1c4}
.danger-t{color:var(--bad)}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
h1,h2,h3{font-family:var(--f-display);margin:0;letter-spacing:.02em}
h1{font-size:28px;font-weight:700;line-height:1.1;margin-top:8px}
.sect{display:flex;justify-content:space-between;align-items:baseline;margin:0 0 10px;font-family:var(--f-display);font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--gold-2)}
.sect span{font-family:var(--f-body);color:var(--faint);letter-spacing:0;text-transform:none;font-weight:500;font-size:12px}
.gem{display:inline-block;width:12px;height:12px;background:var(--c);clip-path:var(--clip,polygon(50% 0,100% 50%,50% 100%,0 50%));flex:none}
.hud{background:var(--panel);border:1px solid var(--line-2);border-radius:3px;box-shadow:0 12px 32px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.07),inset 0 0 0 1px rgba(0,0,0,.4);position:relative}
.hud::before{content:'';position:absolute;left:10px;right:10px;top:-1px;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);pointer-events:none}
.bar{height:5px;border-radius:2px;background:rgba(255,255,255,.1);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--good);border-radius:2px;transition:width .3s}
.bar.acc>i{background:var(--gold)} .bar.bad>i{background:var(--bad)}
.cost{display:flex;flex-wrap:wrap;gap:2px 9px;font-size:12px;color:var(--fg-2);font-variant-numeric:tabular-nums;font-family:var(--f-mono)}
.cost span{display:inline-flex;gap:4px;align-items:center}
.cost .gem{width:9px;height:9px}
.cost .no{color:var(--bad)}
.small{font-size:12px;color:var(--muted);line-height:1.5;margin:0}

#app{position:fixed;inset:0}
#world{position:absolute;inset:0;background:#1d2a27;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
#ov{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
#raidflash{position:absolute;inset:0;pointer-events:none;z-index:2;transition:box-shadow .4s}
#raidflash.on{box-shadow:inset 0 0 110px 14px rgba(239,106,90,.38);animation:rf 1.6s ease-in-out infinite}
@keyframes rf{50%{box-shadow:inset 0 0 60px 6px rgba(239,106,90,.2)}}
#top{display:contents}
.hudlayer>*{z-index:10}

/* ---- age plate (top centre) ---- */
#ageplate{position:absolute;z-index:10;top:6px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:5px 8px 5px 10px;white-space:nowrap}
#ageplate .age{display:flex;flex-direction:column;align-items:center;padding:0 12px;border-left:1px solid var(--line);border-right:1px solid var(--line);min-width:150px}
#ageplate .age b{font-family:var(--f-display);font-size:26px;font-weight:800;line-height:1;color:var(--gold-2);letter-spacing:.08em;display:flex;align-items:center;gap:10px}
#ageplate .age b::before,#ageplate .age b::after{content:'';width:22px;height:2px;background:linear-gradient(90deg,transparent,var(--gold))}
#ageplate .age b::after{transform:scaleX(-1)}
#ageplate .age small{font-family:var(--f-display);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--fg-2);margin-top:2px;font-weight:700}
.day{display:flex;gap:8px;align-items:center}
.day canvas{width:34px;height:34px}
.day b{display:block;font-family:var(--f-display);font-size:13px;letter-spacing:.06em;font-weight:700;line-height:1.1}
.day small{display:block;font-family:var(--f-mono);font-size:12px;color:var(--muted);margin-top:2px}
.day small.raid{color:var(--bad);font-weight:700}
.speed{display:flex;border:1px solid var(--line);border-radius:3px;overflow:hidden}
.speed button{border:0;border-radius:0;padding:5px 9px;min-width:36px;font-family:var(--f-mono);font-size:12px;color:var(--muted);background:transparent}
.speed button.on{background:linear-gradient(#e6c47c,#c69a48);color:#1d1406;font-weight:700}
#topright{position:absolute;z-index:10;top:8px;right:8px;display:flex;gap:6px}
#menuBtn{font-family:var(--f-display);font-weight:700;letter-spacing:.08em;padding:8px 14px}

/* ---- objectives (top left) ---- */
#objectives{position:absolute;z-index:10;top:8px;left:8px;width:300px;padding:10px 12px 12px;max-height:calc(100% - var(--barh) - 80px);overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--line-2) transparent}
.oh{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--gold-2);margin:0 0 6px}
.oh::before{content:'';width:9px;height:9px;transform:rotate(45deg);border:1.5px solid var(--gold);flex:none}
#step b{display:block;font-size:15px;color:var(--fg);line-height:1.3}
#step p{margin:3px 0 0;color:var(--fg-2);font-size:12.5px;line-height:1.45}
#step .primary{margin-top:8px;width:100%}
#step.alarm b{color:#ffb3a8}
#mission{border-top:1px solid var(--line);margin-top:10px;padding-top:9px}
#ageToggle{all:unset;cursor:pointer;display:flex;align-items:center;justify-content:space-between;width:100%;min-height:32px;box-sizing:border-box}
#ageToggle:focus-visible{outline:2px solid var(--gold-2)}
#ageToggle .oh{margin:0}
#ageToggle i{font-style:normal;color:var(--muted);font-size:12px;font-family:var(--f-mono)}
.ages{display:grid;grid-template-columns:repeat(6,1fr);gap:3px;margin:6px 0}
.ages i{height:4px;border-radius:2px;background:rgba(255,255,255,.12)}
.ages i.done{background:var(--gold)}
.why{font-size:12px;color:var(--fg-2);line-height:1.45;margin:2px 0 6px}
#ageBtn{width:100%;margin:2px 0 8px}
#ageBtn:disabled{background:rgba(0,0,0,.2);border:1px dashed var(--line-2);color:var(--fg-2);opacity:1;font-weight:600}
#fixBtn{width:100%;margin-bottom:6px}
.reqs{display:grid;grid-template-columns:16px 1fr auto;gap:4px 8px;align-items:center;font-size:12px}
.reqs .rq{display:contents}
.reqs .rq .bar{grid-column:2/-1;margin:-2px 0 3px;height:4px}
.reqs .v{font-family:var(--f-mono);color:var(--muted);font-size:12px}
.reqs .ok,.reqs .v.ok{color:var(--good)} .reqs .no{color:var(--fg-2)}
#mission.closed .body{display:none}

/* ---- bottom bar ---- */
#resPanel{position:absolute;z-index:10;left:8px;bottom:calc(8px + env(safe-area-inset-bottom,0px));width:var(--resw);height:var(--barh);padding:8px 8px 8px;display:flex;flex-direction:column;gap:3px}
.poprow{display:flex;gap:4px;align-items:center;padding-bottom:5px;border-bottom:1px solid var(--line);margin-bottom:2px}
.pstat{display:flex;align-items:center;gap:5px;padding:3px 7px;border-radius:3px;background:rgba(0,0,0,.25);font-family:var(--f-mono);font-size:13px;min-height:30px}
.pstat i{font-style:normal;color:var(--gold)}
.pstat.bad b{color:var(--bad)}
.pbtn{display:flex;align-items:center;gap:5px;padding:2px 7px;font-family:var(--f-mono);font-size:13px;min-height:30px}
.pbtn i{font-style:normal;color:var(--gold-2)}
#resbar{display:flex;flex-direction:column;gap:2px;min-height:0;overflow:hidden}
.res{display:grid;grid-template-columns:16px 1fr auto;align-items:center;gap:7px;padding:2px 6px;min-height:27px;border-radius:3px;transition:background .3s}
.res:hover{background:rgba(255,255,255,.05)}
.res .gem{width:13px;height:13px}
.res b{font-family:var(--f-mono);font-weight:500;font-size:14px;font-variant-numeric:tabular-nums}
.res em{display:none;font-style:normal;font-family:var(--f-mono);font-size:12px;color:var(--good);margin-left:6px}
.res em.down{color:var(--bad)}
.res small{display:inline;font-size:12px;color:var(--muted);margin-left:6px}
.res .wk{display:flex;align-items:center;gap:3px;font-family:var(--f-mono);font-size:12px;color:var(--fg-2);background:rgba(61,123,224,.22);border:1px solid rgba(61,123,224,.45);border-radius:3px;padding:0 5px;min-width:34px;justify-content:center}
.res .wk.zero{background:transparent;border-color:var(--line);color:var(--faint)}
.res.new{background:var(--soft);box-shadow:inset 0 0 0 1px var(--gold)}
.res.pulse b{color:var(--gold-2)}
#resMore{margin-top:auto;font-size:12px;padding:3px 8px;min-height:30px}
#resPop{position:absolute;z-index:16;left:8px;bottom:calc(var(--barh) + 16px);width:min(520px,calc(100% - 16px));padding:12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:4px}
#resPop .res em{display:inline}
#resPop .res small{display:inline;font-family:var(--f-body);font-size:12px;color:var(--muted);margin-left:4px}

#bar{position:absolute;z-index:10;left:calc(var(--resw) + 14px);right:8px;bottom:calc(8px + env(safe-area-inset-bottom,0px));height:var(--barh);display:flex;gap:6px;pointer-events:none}
#bar>*{pointer-events:auto}
#selPanel{flex:1 1 240px;min-width:0;padding:12px 14px;overflow:hidden auto;scrollbar-width:thin;scrollbar-color:var(--line-2) transparent}
#cmdPanel{width:400px;flex:none;display:flex;flex-direction:column;padding:6px 8px 8px}
#mapPanel{width:228px;flex:none;padding:8px;display:flex;flex-direction:column;gap:6px;align-items:stretch}
#mini{display:block;width:100%;flex:1;min-height:0;aspect-ratio:1;object-fit:contain;cursor:pointer;background:radial-gradient(#141c27,#0b1017);border-radius:3px}
.mapbtns{display:flex;gap:4px}
.mapbtns button{flex:1;padding:4px 0;font-size:15px;min-height:34px;min-width:34px}
#expandBtn{flex:2.6;font-size:12px;font-weight:600}
#expandBtn.on{background:var(--soft);border-color:var(--gold)}

/* selection panel */
.selh{display:flex;gap:12px;align-items:center;padding-right:30px}
.port{width:74px;height:74px;border-radius:50%;flex:none;background:radial-gradient(circle at 50% 35%,#2d3c55,#121a27);border:2px solid var(--gold);box-shadow:0 0 0 3px rgba(0,0,0,.45),inset 0 0 12px rgba(0,0,0,.6);display:grid;place-items:center;overflow:hidden}
.port img{width:86%;height:86%;object-fit:contain}
.port .gem{width:30px;height:30px}
.selt{font-family:var(--f-display);font-size:18px;font-weight:700;line-height:1.1;color:var(--fg);letter-spacing:.03em}
.sels{font-size:12.5px;color:var(--fg-2);margin-top:3px;line-height:1.35}
.lv{font-family:var(--f-mono);font-size:12px;color:var(--gold-2);font-weight:500;vertical-align:middle;margin-left:4px}
.stats{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:9px;font-family:var(--f-mono);font-size:12px;color:var(--fg-2)}
.stats span{display:inline-flex;gap:5px;align-items:center}
.stats i{font-style:normal;color:var(--gold)}
.hpline{display:flex;align-items:center;gap:8px;margin-top:8px;font-family:var(--f-mono);font-size:12px;color:var(--fg-2)}
.hpline .bar{flex:1;height:7px}
#selPanel .x{position:absolute;top:6px;right:6px;font-size:18px;padding:2px 9px}
.statline{display:flex;gap:7px;align-items:center;font-size:12px;color:var(--fg-2);font-family:var(--f-mono);margin-top:6px}
.statline .dot{width:7px;height:7px;border-radius:50%;background:var(--good);box-shadow:0 0 6px var(--good);flex:none}
.statline.warn{color:var(--warn)} .statline.warn .dot{background:var(--warn);box-shadow:0 0 6px var(--warn)}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;font-size:12px;border-radius:3px;min-height:32px}
.chip.on{background:linear-gradient(#e6c47c,#c69a48);color:#1d1406;border-color:#f3dca0;font-weight:700}
.stack{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.stack span{display:inline-flex;align-items:center;gap:4px;padding:2px 6px 2px 2px;border-radius:3px;background:rgba(0,0,0,.25);border:1px solid var(--line)}
.stack img{width:26px;height:26px}
.stack b{font-family:var(--f-mono);font-size:12px;font-weight:500}
.queue{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.qchip{font-size:12px;padding:2px 8px;border-radius:3px;background:rgba(0,0,0,.25);color:var(--fg-2);font-family:var(--f-mono);border:1px solid var(--line)}
.qchip:hover{border-color:var(--bad);color:#ffd9d4;text-decoration:line-through}
.trade{display:grid;grid-template-columns:1fr auto auto;gap:4px 6px;align-items:center;font-size:12px;margin-top:8px}
.trade span{display:inline-flex;gap:6px;align-items:center}
.trade button{padding:3px 7px;font-family:var(--f-mono);font-size:12px}
.pips{display:flex;gap:4px;flex:none}
.pips i{width:9px;height:9px;transform:scaleY(.7) rotate(45deg);border:1.5px solid var(--line-2);background:transparent}
.pips i.on{background:var(--gold);border-color:var(--gold)} .pips i.av{border-color:var(--gold-2);background:var(--soft)}
.lvrow{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);font-family:var(--f-mono);margin-top:7px}
.empty .selt{font-size:16px}

/* command grid */
.cats{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:6px;flex:none}
.cats button{border:0;border-bottom:2px solid transparent;border-radius:0;background:transparent;padding:4px 9px;min-height:32px;position:relative;font-family:var(--f-display);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.cats button.on{color:var(--gold-2);border-bottom-color:var(--gold)}
.cats button.hint:not(.on)::after{content:'';position:absolute;top:3px;right:0;width:8px;height:8px;border-radius:50%;background:var(--gold-2);animation:hintp 1.2s ease-in-out infinite}
.cats .ctx{font-family:var(--f-display);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--gold-2);padding:6px 4px;min-height:32px;display:flex;align-items:center}
@keyframes hintp{50%{opacity:.3}}
#cmdgrid{display:grid;grid-template-columns:repeat(5,1fr);grid-auto-rows:84px;gap:5px;overflow-y:auto;min-height:0;flex:1;scrollbar-width:thin;scrollbar-color:var(--line-2) transparent;align-content:start}
.gb,.cb{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:1px;padding:4px 2px 3px;min-width:0;border-radius:3px;background:linear-gradient(180deg,#2a3549,#18202e);border:1px solid #3a4862;box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 1px 0 rgba(0,0,0,.5);text-align:center;line-height:1.1;font-size:12px}
.gb:hover:not(:disabled),.cb:hover:not(:disabled){border-color:var(--gold);background:linear-gradient(180deg,#34425a,#1e2838)}
.gb img,.cb img{width:38px;height:38px;flex:none}
.cb .g{font-size:22px;line-height:38px;height:38px;color:var(--fg)}
.gb b,.cb .l{font-weight:600;color:var(--fg);max-width:100%;overflow-wrap:anywhere;hyphens:manual;font-size:12px;line-height:1.12}
.gb .cost,.cb .c .cost{justify-content:center;gap:0 6px;font-size:12px;margin-top:auto}
.cb .c{margin-top:auto;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.gb.active,.cb.on{border-color:var(--gold-2);background:linear-gradient(180deg,#5a4a26,#2c2414);box-shadow:0 0 0 1px var(--gold),0 0 14px rgba(214,180,108,.35)}
.gb.poor img{filter:saturate(.45) brightness(.8)} .gb.poor b{color:var(--muted)}
.gb.locked{opacity:.62;cursor:default}
.gb .lk{position:absolute;top:2px;right:4px;font-family:var(--f-display);font-size:12px;font-weight:700;color:var(--gold-2)}
.gb .nw{position:absolute;top:2px;left:2px;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:#1d1406;background:var(--gold-2);border-radius:2px;padding:0 4px;line-height:16px}
.gb.hint{border-color:var(--gold-2);animation:tilep 1.3s ease-in-out infinite}
@keyframes tilep{0%,100%{box-shadow:0 0 0 2px var(--gold-2),0 0 20px rgba(240,215,150,.5)}50%{box-shadow:0 0 0 2px var(--gold-2),0 0 4px transparent}}
.cb.danger .g{color:var(--bad)}
.cb:disabled,.gb:disabled{opacity:.5}
.cb .lk{font-family:var(--f-display);font-weight:700;color:var(--gold-2)}

/* side tabs + floating panel */
#sidebtns{position:absolute;z-index:10;left:8px;bottom:calc(var(--barh) + 14px);display:flex;gap:4px}
#sidebtns button{position:relative;font-family:var(--f-display);font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;padding:6px 10px;background:var(--panel);border-color:var(--line-2)}
#sidebtns button.on{color:var(--gold-2);border-color:var(--gold)}
#sidebtns button i{position:absolute;top:-4px;right:-4px;width:10px;height:10px;border-radius:50%;background:var(--gold-2);display:none;box-shadow:0 0 0 2px #121a26}
#sidebtns button.dot i{display:block}
#panel{position:absolute;z-index:11;left:8px;bottom:calc(var(--barh) + 58px);width:320px;max-height:calc(100% - var(--barh) - 140px);display:flex;flex-direction:column}
#panel .ph{display:flex;justify-content:space-between;align-items:center;padding:8px 8px 8px 14px;border-bottom:1px solid var(--line)}
#panel .ph b{font-family:var(--f-display);font-size:14px;letter-spacing:.08em;color:var(--gold-2);text-transform:uppercase}
.pbody{overflow-y:auto;padding:12px 14px;min-height:0;scrollbar-width:thin;scrollbar-color:var(--line-2) transparent}
.pane{display:none} .pane.on{display:block}
.cmd{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.cmd .cb{min-height:76px}
.jobrow{display:grid;grid-template-columns:14px 1fr 34px 30px 34px;align-items:center;gap:6px;padding:3px 0;font-size:12.5px}
.jobrow b{text-align:center;font-family:var(--f-mono);font-weight:500}
.jobrow button{padding:0;height:32px;font-family:var(--f-mono);font-size:14px;line-height:1}
.jobrow.auto{background:rgba(0,0,0,.25);border-radius:3px;padding:5px 6px;margin:0 -6px 4px}
.jobrow .na{color:var(--faint)}
.hlt{display:flex;justify-content:space-between;font-size:12px;color:var(--fg-2);margin:4px 0 6px}
.hlt b{font-family:var(--f-mono);font-weight:500}
.raidcard{display:flex;gap:11px;align-items:center;background:rgba(240,191,85,.08);border:1px solid rgba(240,191,85,.3);border-radius:3px;padding:11px;margin-top:12px;color:#f0dba6}
.raidcard.now{background:rgba(239,106,90,.12);border-color:rgba(239,106,90,.5);color:#ffd9d4}
.raidcard canvas{width:30px;height:30px;flex:none}
.raidcard b{display:block;font-size:12.5px;font-weight:600}
.raidcard small{display:block;font-size:12px;margin-top:2px}
.tech{display:grid;grid-template-columns:34px 1fr;gap:2px 9px;align-items:center;width:100%;text-align:left;padding:7px 9px;margin-bottom:5px;background:linear-gradient(180deg,#26314a,#18202e);border:1px solid #3a4862}
.tech .g{grid-row:1/4;width:34px;height:34px;display:grid;place-items:center;border-radius:3px;background:rgba(0,0,0,.3);font-size:17px}
.tech b{font-size:12.5px;font-weight:600}
.tech .d{font-size:12px;color:var(--muted);line-height:1.3}
.tech.done{border-color:rgba(143,210,122,.5)} .tech.done .g{background:rgba(143,210,122,.25)}
.tech.run{border-color:var(--gold)} .tech.lock{opacity:.6;border-style:dashed}
.agehd{font-family:var(--f-display);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold-2);margin:10px 0 5px}
.log .e{padding:7px 0;border-bottom:1px solid var(--line);font-size:12px;line-height:1.5;color:var(--fg-2)}
.log .e span{font-family:var(--f-mono);font-size:12px;color:var(--faint);margin-right:6px}
.log .e.bad{color:#ffd9d4} .log .e.good{color:var(--good)} .log .e.age{color:var(--gold-2);font-weight:600}
.saved{font-size:12px;color:var(--faint);margin-top:14px;display:flex;gap:6px;align-items:center}
.jump{cursor:pointer;pointer-events:auto} .jump:hover{border-color:var(--gold)!important}
.go{font-style:normal;color:var(--gold-2);margin-left:4px}

/* hint bar (placing / orders) */
#hintbar{position:absolute;z-index:11;left:50%;transform:translateX(-50%);bottom:calc(var(--barh) + 14px);display:flex;align-items:center;gap:10px;padding:6px 8px 6px 12px;max-width:min(640px,calc(100% - 20px));font-size:13px;color:var(--fg-2)}
#hintbar b{color:var(--gold-2);white-space:nowrap}
#hintbar .dot{width:8px;height:8px;border-radius:50%;background:var(--gold);flex:none}
#hintbar .dot.army{background:var(--bad)}
#hintbar button{flex:none}

/* notes */
#notes{position:absolute;z-index:12;top:70px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:min(460px,calc(100% - 32px))}
#toast{padding:9px 14px;border-radius:3px;background:var(--p2);border:1px solid var(--line-2);color:var(--fg);font-size:13px;opacity:0;transform:translateY(-6px);transition:opacity .25s,transform .25s;max-width:100%;box-shadow:0 10px 30px rgba(0,0,0,.45)}
#toast.show{opacity:1;transform:none}
#toast.bad{border-color:var(--bad);color:#ffd9d4} #toast.good{border-color:var(--good)} #toast.age{border-color:var(--gold);color:var(--gold-2)}
#feed{display:flex;flex-direction:column;gap:4px;align-items:center;width:100%}
#feed .e{font-size:12px;padding:5px 11px;border-radius:3px;background:rgba(15,22,34,.88);border:1px solid var(--line);color:var(--fg-2);animation:fin .3s ease-out;max-width:100%}
#feed .e span{font-family:var(--f-mono);font-size:12px;color:var(--faint);margin-right:6px}
#feed .e.bad{color:#ffd9d4} #feed .e.good{color:var(--good)} #feed .e.age{color:var(--gold-2)}
@keyframes fin{from{opacity:0;transform:translateY(-5px)}}
#offer{pointer-events:auto;display:flex;align-items:center;gap:10px;padding:8px 10px;width:100%}
#offer .ic{width:40px;height:40px;border-radius:3px;background:rgba(0,0,0,.3);display:grid;place-items:center;font-size:20px;flex:none}
#offer b{display:block;font-family:var(--f-display);font-size:13px;letter-spacing:.06em}
#offer .t{flex:1;min-width:0;font-size:12px;color:var(--fg-2)}
#offer .bar{height:3px;margin-top:5px}
#event{pointer-events:auto;width:100%;padding:12px 14px;display:flex;flex-direction:column;gap:9px}
#event .eh{display:flex;gap:11px;align-items:center}
#event .ic{width:42px;height:42px;border-radius:3px;background:var(--soft);border:1px solid var(--gold);display:grid;place-items:center;font-size:21px;flex:none;color:var(--gold-2)}
#event b{display:block;font-family:var(--f-display);font-size:15px;letter-spacing:.06em}
#event p{margin:2px 0 0;font-size:12.5px;color:var(--fg-2);line-height:1.45}
#event .ch{display:grid;grid-template-columns:1fr 1fr;gap:6px}
#event .ch button{display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding:8px 10px;font-weight:600;text-align:left}
#event .bar{height:3px}
#hovertip{position:absolute;z-index:20;pointer-events:none;background:#121a26;border:1px solid var(--line-2);border-radius:3px;padding:8px 11px;font-size:12px;box-shadow:0 10px 30px rgba(0,0,0,.5);max-width:270px;line-height:1.45}
#hovertip b{display:block;font-family:var(--f-display);font-size:14px;letter-spacing:.04em;color:var(--gold-2)}
#hovertip span{color:var(--fg-2);display:block}
#hovertip .key{color:var(--muted);font-family:var(--f-mono);margin-top:4px}
#hovertip.ok{border-color:var(--good)} #hovertip.ok b{color:var(--good)}
#hovertip.bad{border-color:var(--bad)} #hovertip.bad b{color:#ff9a8c}
#hovertip .cost{margin-top:5px}
#banner{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;z-index:13}
#banner .in{text-align:center;animation:ban 4.4s cubic-bezier(.2,.7,.2,1) forwards}
#banner .eyebrow{color:var(--fg-2);letter-spacing:.4em}
#banner .t{font-family:var(--f-display);font-weight:800;font-size:clamp(44px,9vw,96px);letter-spacing:.06em;text-transform:uppercase;line-height:1;margin-top:8px;color:var(--gold-2);text-shadow:0 4px 30px rgba(0,0,0,.6)}
#banner .y{font-family:var(--f-mono);color:var(--fg);margin-top:8px;font-size:13px;text-shadow:0 2px 10px rgba(0,0,0,.6)}
@keyframes ban{0%{opacity:0;transform:scale(.94)}12%{opacity:1;transform:none}82%{opacity:1}100%{opacity:0}}
body.titled #top>*,body.titled #bar,body.titled #notes,body.titled #topright,body.titled #sidebtns,body.titled #panel,body.titled #hintbar{opacity:0;pointer-events:none}
#top>*,#bar,#notes,#topright,#sidebtns{transition:opacity .4s}

/* modal + title */
#modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px;background:rgba(4,7,12,.66);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
.sheet{width:min(560px,100%);max-height:calc(100% - 24px);overflow-y:auto;background:var(--panel);border:1px solid var(--line-2);border-radius:4px;padding:28px 30px;box-shadow:0 30px 90px rgba(0,0,0,.6);position:relative}
.sheet h1{font-size:30px;margin-top:8px;text-transform:uppercase;letter-spacing:.06em;color:var(--gold-2)}
.sheet p{color:var(--fg-2);line-height:1.75;margin:14px 0 0;max-width:60ch}
.sheet p b{color:var(--fg)}
.sheet .row{margin-top:20px;display:flex;gap:6px;flex-wrap:wrap}
.sheet .row button{padding:10px 16px;font-size:13px}
.sheet .x{position:absolute;top:12px;right:12px;font-size:18px;padding:4px 10px}
.keys{display:grid;grid-template-columns:auto 1fr;gap:7px 14px;margin-top:18px;font-size:12px;color:var(--fg-2)}
.keys kbd{font-family:var(--f-mono);font-size:12px;border:1px solid var(--line-2);border-radius:3px;padding:1px 6px;background:rgba(0,0,0,.3);color:var(--fg);justify-self:start;white-space:nowrap}
#title{position:fixed;inset:0;z-index:45;display:flex;align-items:center;padding-block:24px;padding-left:max(56px,env(safe-area-inset-left,0px));padding-right:16px;background:linear-gradient(90deg,rgba(8,12,18,.95) 0%,rgba(8,12,18,.82) 34%,rgba(8,12,18,.15) 72%,rgba(8,12,18,0));overflow-y:auto}
#title .tw{width:min(420px,100%);display:flex;flex-direction:column;gap:16px;margin-block:auto}
#title .logo{font-family:var(--f-display);font-weight:800;font-size:clamp(46px,7vw,84px);letter-spacing:.06em;line-height:.92;color:#f3e3b8;text-shadow:0 6px 40px rgba(0,0,0,.7)}
#title .tag{font-family:var(--f-mono);color:var(--gold-2);letter-spacing:.22em;text-transform:uppercase;font-size:12px}
#title .agesrow{display:flex;gap:5px}
#title .agesrow span{flex:1;height:30px;display:grid;place-items:center;border-radius:2px;font-family:var(--f-display);font-weight:800;font-size:13px;color:#14100a}
.mbtn{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;padding:13px 18px;font-family:var(--f-display);font-size:16px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;background:linear-gradient(180deg,#26314a,#161e2c);border:1px solid var(--line-2);border-radius:3px;color:var(--fg)}
.mbtn small{font-family:var(--f-mono);font-size:12px;letter-spacing:0;text-transform:none;color:var(--muted);font-weight:400}
.mbtn:hover:not(:disabled){border-color:var(--gold);background:linear-gradient(180deg,#30405e,#1c2638)}
.mbtn.primary{background:linear-gradient(#e6c47c,#c69a48);color:#1d1406;border-color:#f3dca0}
.mbtn.primary small{color:rgba(29,20,6,.75)}
.mstack{display:flex;flex-direction:column;gap:7px}
.diff{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.diff button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:9px 10px;text-align:left}
.diff button b{font-family:var(--f-display);font-size:13px;letter-spacing:.06em;text-transform:uppercase}
.diff button small{font-size:12px;color:var(--muted);line-height:1.3}
.diff button.on{border-color:var(--gold);background:var(--soft)}
.tfoot{font-family:var(--f-mono);font-size:12px;color:var(--faint)}
.setrow{display:grid;grid-template-columns:1fr auto;gap:4px 14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.setrow b{font-size:13px}.setrow small{display:block;font-size:12px;color:var(--muted)}
.setrow input[type=range]{width:150px;accent-color:var(--gold)}
.tog{width:52px;height:32px;border-radius:16px;padding:0;position:relative;background:rgba(0,0,0,.3)}
.tog::after{content:'';position:absolute;top:4px;left:4px;width:22px;height:22px;border-radius:50%;background:var(--muted);transition:transform .15s,background .15s}
.tog.on{background:var(--soft);border-color:var(--gold)}.tog.on::after{transform:translateX(20px);background:var(--gold-2)}

/* ---- responsive ---- */
@media (max-width:1240px){:root{--resw:196px}#cmdPanel{width:378px}#mapPanel{width:196px}#objectives{width:268px}}
@media (max-width:1100px){#ageplate .day small{display:none}#ageplate .age{min-width:120px}}
@media (max-width:980px) and (min-width:901px){#objectives{width:240px}#ageplate{left:auto;right:96px;transform:none}}
@media (max-width:900px){
  :root{--barh:auto}
  #top{display:flex;flex-direction:column;gap:5px;position:absolute;z-index:10;top:calc(6px + env(safe-area-inset-top,0px));left:6px;right:6px;pointer-events:none}
  #top>*{position:static!important;transform:none!important;width:auto!important;height:auto!important;pointer-events:auto;max-height:none}
  #ageplate{align-self:flex-start;margin-right:84px;gap:6px;padding:4px 6px}
  #ageplate .age{min-width:0;padding:0 8px}#ageplate .age b{font-size:20px}#ageplate .age b::before,#ageplate .age b::after{width:10px}
  #topright{top:calc(6px + env(safe-area-inset-top,0px));right:6px}
  #resPanel{flex-direction:row;flex-wrap:wrap;align-items:center;padding:4px 6px;gap:4px}
  .poprow{border:0;margin:0;padding:0}
  #resbar{flex-direction:row;flex-wrap:nowrap;gap:3px;flex:1;min-width:0}
  .res{grid-template-columns:14px auto;gap:5px;padding:2px 6px;background:rgba(0,0,0,.22)}
  .res .wk,.res em,.res small{display:none}
  #resMore{margin:0}
  #resPop{bottom:auto;top:calc(var(--topH,120px) + 4px)}
  #objectives{padding:8px 10px}
  #mission{display:none}
  body.showgoal #mission{display:block}
  #bar{left:6px;right:6px;bottom:calc(6px + env(safe-area-inset-bottom,0px));height:auto;align-items:flex-end}
  #mapPanel{display:none}
  body.showmap #mapPanel{display:flex;position:fixed;z-index:30;left:50%;top:50%;transform:translate(-50%,-50%);width:min(340px,calc(100% - 20px));height:auto}
  body.showmap #mini{height:auto}
  #selPanel{max-height:46vh;align-self:stretch}
  #cmdPanel{width:min(400px,58%)}
  #sidebtns{display:none}
  #panel{position:fixed;left:6px;right:6px;top:calc(var(--topH,120px) + 6px);bottom:calc(var(--barH,240px) + 12px);width:auto;max-height:none}
  #hintbar{bottom:calc(var(--barH,240px) + 12px)}
  #notes{top:calc(var(--topH,120px) + 8px)}
  #feed{display:none}
}
@media (max-width:620px){
  #title{padding-left:16px;background:rgba(8,12,18,.88)}
  #ageplate .day canvas{display:none}#ageplate .speed button[data-s="4"]{display:none}
  #ageplate .age small{display:none}
  #bar{flex-direction:column;align-items:stretch;gap:5px}
  #selPanel{display:none;max-height:34vh;padding:10px 12px}
  body.insp #selPanel{display:block}
  #cmdPanel{width:auto}
  #cmdgrid{grid-auto-rows:80px}
  .port{width:56px;height:56px}
  .selt{font-size:16px}
  #hintbar{font-size:12px}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition:none!important}}

<body>
<div id="app" lang="nl">
  <section id="world">
    <canvas id="cv" tabindex="0" aria-label="Spelwereld"></canvas>
    <canvas id="ov" aria-hidden="true"></canvas>
    <div id="raidflash"></div>
    <div id="top">
      <div id="ageplate" class="hud">
        <div class="day"><canvas id="dial" width="68" height="68"></canvas><div><b id="dayTxt">Dag 1</b><small id="timeTxt">07:00</small></div></div>
        <div class="age" title="Huidig tijdperk"><b id="ageNum">I</b><small id="locEyebrow">Steentijd</small></div>
        <div class="speed" id="speed" role="group" aria-label="Spelsnelheid"><button data-s="0" aria-label="Pauze">II</button><button data-s="1" class="on" aria-label="Normale snelheid">1×</button><button data-s="2" aria-label="Dubbele snelheid">2×</button><button data-s="4" aria-label="Viervoudige snelheid" hidden>4×</button></div>
      </div>
      <section id="resPanel" class="hud" aria-label="Grondstoffen">
        <div class="poprow"><div class="pstat" id="popStat" title="Inwoners en plek in woningen"><i>⌂</i><b>5/5</b></div><div class="pstat" id="powStat" hidden title="Stroom: geleverd / nodig"><i>ϟ</i><b>0/0</b></div><span id="quick"></span></div>
        <div id="resbar"></div>
      </section>
      <section id="objectives" class="hud" aria-label="Doelen">
        <div id="step"><div class="oh">Volgende stap</div><b id="modeTxt"></b><p id="modeHint"></p><button class="primary" id="coachBtn" hidden></button></div>
        <div id="mission"></div>
      </section>
    </div>
    <div id="topright"><button id="menuBtn" class="hud">Menu</button></div>
    <div id="resPop" class="hud" hidden></div>
    <div id="notes"><div id="toast" role="status" aria-live="polite"></div><div id="event" class="hud" hidden></div><div id="offer" class="hud" hidden></div><div id="feed"></div></div>
    <nav id="sidebtns" aria-label="Panelen"><button data-p="pop">Volk<i></i></button><button data-p="def" hidden>Leger<i></i></button><button data-p="upg" hidden>Onderzoek<i></i></button><button data-p="log" hidden>Logboek<i></i></button></nav>
    <section id="panel" class="hud" hidden>
      <div class="ph"><b id="panelTitle">Volk</b><button class="quiet" id="panelClose">Sluiten</button></div>
      <div class="pbody">
        <div class="pane" data-pane="pop"><div class="sect">Bevolking <span id="popSect"></span></div><div id="jobs"></div></div>
        <div class="pane" data-pane="def"><div class="sect">Verdediging <span id="defSect"></span></div><div id="defense"></div></div>
        <div class="pane" data-pane="upg"><div class="sect">Verbeteringen <span id="upgSect"></span></div><div id="upgrades"></div></div>
        <div class="pane" data-pane="log"><div class="sect">Voorraad <span>laatste 10 min</span></div><canvas id="chart" width="480" height="120" style="width:100%;height:60px;display:block;margin-bottom:12px;border-radius:3px;background:rgba(0,0,0,.25)"></canvas><div class="sect">Veldnotities <span>Live</span></div><div class="log" id="log"></div><div class="saved" id="saved"><i class="gem" style="--c:var(--faint)"></i>Voortgang wordt in deze browser bewaard</div></div>
      </div>
    </section>
    <div id="hintbar" class="hud" hidden><i class="dot" id="modeDot"></i><b id="hintTxt"></b><span id="hintSub"></span><button class="quiet" id="cancelBtn">Annuleren</button></div>
    <footer id="bar">
      <section id="selPanel" class="hud" aria-label="Selectie"><div id="inspector"></div></section>
      <section id="cmdPanel" class="hud" aria-label="Opdrachten"><div class="cats" id="cats" role="tablist"></div><div id="cmdgrid"></div></section>
      <section id="mapPanel" class="hud" aria-label="Kaart">
        <canvas id="mini" width="344" height="344" aria-label="Overzichtskaart"></canvas>
        <div class="mapbtns"><button id="zOut" aria-label="Uitzoomen" title="Uitzoomen">−</button><button id="zIn" aria-label="Inzoomen" title="Inzoomen">+</button><button id="zHome" aria-label="Naar het stamhuis" title="Naar het stamhuis">⌂</button><button id="expandBtn" title="Gebied uitbreiden"><span>Uitbreiden</span></button></div>
      </section>
    </footer>
    <div id="hovertip" hidden></div>
    <div id="banner" hidden></div>
  </section>
</div>
<div id="title" hidden></div>
<div id="modal" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s);
const W=128,H=128,CS=16,CN=W/CS,DAYLEN=200,TW=32,TH=16,TAU=Math.PI*2,R2=Math.SQRT2;

  lithium:{n:'Lithium',c:'#7fcdb5',age:5}, chips:{n:'Chips',c:'#2fae80',age:5,cr:1}, battery:{n:'Accu\'s',c:'#77bf40',age:5,cr:1},
};

const BASEW={food:1.5,wood:1.3,stone:1,copper:.9,tin:.9,iron:.95,gold:.6,coal:.95,sand:.8,lithium:.8};
const AGES=[
  {n:'Steentijd',y:'± 10.000 v.Chr.',r:'I',title:'Een klein begin.',sub:'Maak een thuis aan de rand van de wildernis.',lvl:'Kampement',acc:'#8a6b2f'},
  {n:'Bronstijd',y:'± 3000 v.Chr.',r:'II',title:'Brons en vuur.',sub:'Koper en tin smelten samen tot iets sterkers.',lvl:'Dorp',acc:'#a5602d'},

// ================= UTIL =================
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hash2(x,y,s){let h=Math.imul(x|0,374761393)^Math.imul(y|0,668265263)^Math.imul(s|0,982451653);h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967296}
function vnoise(x,y,s){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);const a=hash2(xi,yi,s),b=hash2(xi+1,yi,s),c=hash2(xi,yi+1,s),d=hash2(xi+1,yi+1,s);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v}
function fbm(x,y,s){let t=0,a=.5,f=1,n=0;for(let i=0;i<4;i++){t+=vnoise(x*f,y*f,s+i*31)*a;n+=a;a*=.5;f*=2}return t/n}

    if(d.power&&powerRatio<.3)continue;if(d.gen&&!d.gen.solar&&!b.run)continue;
    lights.push({x:b.x+d.size/2,y:b.y+d.size/2,r:bLight(b),warm:b.type==='campfire'||b.type==='lantern'||(b.type==='townhall'&&G.age<3)})}
  claims.fill(0);wr={};siteCnt.clear();farmCnt.clear();
  for(const v of G.vs){if(v.hidden)continue;const t=v.tgt;
    if(t){if(t.k==='node')claims[t.i]=Math.min(255,claims[t.i]+1);else if(t.k==='farm')farmCnt.set(t.b.id,(farmCnt.get(t.b.id)||0)+1);else if(t.k==='site')siteCnt.set(t.b.id,(siteCnt.get(t.b.id)||0)+1)}
    if(v.res&&(v.state==='gather'||v.state==='walk'))wr[v.res]=(wr[v.res]||0)+1}
  demand={};
  for(const b of G.bs){if(!b.done||!b.on)continue;const d=B[b.type];const inp=d.conv?d.conv.in:d.gen&&d.gen.in;if(inp)for(const k in inp)demand[k]=1}
  if(G.us.length||G.bs.some(b=>b.q.length))demand.food=1;
}
function computeAvail(){
  avail={};
  for(const r of GATHER){if(RES[r].age>G.age)continue;
    if(r==='food'&&G.bs.some(b=>b.type==='farm'&&b.done)){avail.food=1;continue}
    for(const t of RES_NODES[r]){if(NODES[t].age>G.age)continue;const L=nodeLists[t];
      for(let j=0;j<L.length;j++){const i=L[j];if(node[i]===t&&amt[i]>0&&isUnl(i%W,(i/W)|0)){avail[r]=1;break}}
      if(avail[r])break}}
}
function litAt(x,y){for(const L of lights)if(dist(x,y,L.x,L.y)<=L.r-.3)return true;return false}

// ================= VILLAGER AI =================
function nearestDrop(x,y){let best=null,bd=1e9;for(const b of G.bs){const d=B[b.type];if(!b.done||!d.drop)continue;const dd=dist(x,y,b.x+d.size/2,b.y+d.size/2);if(dd<bd){bd=dd;best=b}}return best}
function nearestShelter(x,y){let best=null,bd=1e9;for(const b of G.bs){const d=B[b.type];if(!b.done||!d.pop)continue;const dd=dist(x,y,b.x+d.size/2,b.y+d.size/2);if(dd<bd){bd=dd;best=b}}return best}
function walkTo(v,tx,ty,on){
  const p=findPath(v.x|0,v.y|0,tx,ty,false);
  if(p===null){if(v.tgt&&v.tgt.k==='node')unreach[v.tgt.i]=G.t+40;v.tgt=null;v.keep=null;v.state='idle';v.wait=.6;return false}
  v.path=p;v.state='walk';v.on=on;return true;
}
function bTile(b,x,y){const s=B[b.type].size;return[clamp(Math.floor(x),b.x,b.x+s-1),clamp(Math.floor(y),b.y,b.y+s-1)]}
function goDeliver(v){const d=nearestDrop(v.x,v.y);if(!d){v.state='idle';v.wait=2;return}const t=bTile(d,v.x,v.y);v.tgt=null;walkTo(v,t[0],t[1],'drop')}
function goHome(v){const b=nearestShelter(v.x,v.y);if(!b){v.state='idle';v.wait=2;return}const t=bTile(b,v.x,v.y);v.tgt=null;v.shelter=b.id;walkTo(v,t[0],t[1],'sleep')}
function goShelter(v){const b=nearestShelter(v.x,v.y);if(!b)return;const t=bTile(b,v.x,v.y);v.tgt=null;v.shelter=b.id;walkTo(v,t[0],t[1],'shelter')}
function hide(v,kind){v.hidden=true;v.state=kind;v.tgt=null;v.path=null;v.wait=3}
function unhide(v){const b=bById.get(v.shelter);v.hidden=false;v.state='idle';v.wait=Math.random()*.6;if(b){const s=B[b.type].size;v.x=b.x+s/2+(Math.random()-.5)*.6;v.y=b.y+s+.3;if(!walkable(v.x|0,v.y|0)){v.x=b.x+.5;v.y=b.y+.5}}}
function farmFree(b,v){return(farmCnt.get(b.id)||0)<farmSlots(b)||(v&&v.tgt&&v.tgt.b===b)}
function pickSite(v,explicit,night){
  if(v.prefSite&&!v.prefSite.dead&&!v.prefSite.done)return v.prefSite;
  let best=null,bd=1e9;
  for(const b of G.bs){if(b.done||b.dead)continue;if((siteCnt.get(b.id)||0)>=(explicit?8:3))continue;
    if(night&&!litAt(b.x+.5,b.y+.5))continue;const d=dist(v.x,v.y,b.x,b.y);if(d<bd){bd=d;best=b}}
  return best;
}
function pickTarget(v,res,night){
  const ok=(x,y)=>!night||litAt(x+.5,y+.5);
  const k=v.keep;
  if(k){if(k.k==='node'&&node[k.i]&&NODES[node[k.i]].res===res&&amt[k.i]>0&&unreach[k.i]<=G.t&&ok(k.i%W,(k.i/W)|0)&&claims[k.i]<3)return k;
    if(k.k==='farm'&&!k.b.dead&&k.b.done&&res==='food'&&farmFree(k.b,v)&&ok(k.b.x,k.b.y))return k;v.keep=null}
  let best=null,bd=1e9;
  if(res==='food')for(const b of G.bs){if(b.type!=='farm'||!b.done||!farmFree(b,v)||!ok(b.x,b.y))continue;const d=dist(v.x,v.y,b.x+1,b.y+1)-6;if(d<bd){bd=d;best={k:'farm',b}}}
  for(const t of RES_NODES[res]||[]){if(NODES[t].age>G.age)continue;const L=nodeLists[t];
    for(let j=L.length-1;j>=0;j--){const i=L[j];if(node[i]!==t||amt[i]===0){L[j]=L[L.length-1];L.pop();continue}
      const x=i%W,y=(i/W)|0;if(!isUnl(x,y)||unreach[i]>G.t||!ok(x,y))continue;
      const d=Math.abs(x-v.x)+Math.abs(y-v.y)+claims[i]*6;if(d<bd){bd=d;best={k:'node',i}}}}
  return best;
}
function autoOrder(){
  const nx=AGE_UP[G.age+1],arr=[];
  for(const r of GATHER){if(!avail[r])continue;let w=BASEW[r];const st=G.res[r];
    let need=nx&&nx.cost[r]||0;if(demand[r])need=Math.max(need,st+150);
    if(need>st)w*=1+Math.min(2,(need-st)/Math.max(need,1)*2.2);
    if(r==='food'&&st<60)w*=2;
    arr.push([w/(1+st/260)/(1+(wr[r]||0)*.5),r])}
  arr.sort((a,b)=>b[0]-a[0]);return arr.map(a=>a[1]);
}
function decide(v){
  const night=isNight();
  if(v.job==='auto'||v.job==='build'){
    const site=pickSite(v,v.job==='build',night);
    if(site){if(v.carry.amt){goDeliver(v);return}v.tgt={k:'site',b:site};siteCnt.set(site.id,(siteCnt.get(site.id)||0)+1);const s=B[site.type].size;walkTo(v,site.x+(v.id%s),site.y+s-1,'build');return}
    if(v.job==='build'){idleOrHome(v,night);return}
  }
  const order=v.job==='auto'?autoOrder():[v.job];
  for(const res of order){const t=pickTarget(v,res,night);if(!t)continue;
    if(v.carry.amt&&v.carry.res!==res){goDeliver(v);return}
    v.res=res;v.tgt=t;wr[res]=(wr[res]||0)+1;
    let tx,ty;if(t.k==='node'){claims[t.i]++;tx=t.i%W;ty=(t.i/W)|0}else{farmCnt.set(t.b.id,(farmCnt.get(t.b.id)||0)+1);const sl=v.id%4;tx=t.b.x+(sl&1);ty=t.b.y+(sl>>1)}
    walkTo(v,tx,ty,'gather');return}
  idleOrHome(v,night);
}
function idleOrHome(v,night){if(v.carry.amt){goDeliver(v);return}if(night)goHome(v);else{v.state='idle';v.wait=1.5}}
function foeNear(x,y,r){for(const f of G.foes){if(f.retreat)continue;if(f.camp&&!f.aggro)continue;if(Math.abs(f.x-x)<r&&Math.abs(f.y-y)<r&&dist(f.x,f.y,x,y)<r)return f}return null}
function vUpdate(v,dt){
  v.anim+=dt;
  if(v.hidden){v.hp=Math.min(v.mhp,v.hp+dt*2);
    if(v.state==='sleep'){if(!isNight()&&!foeNear(v.x,v.y,9))unhide(v)}
    else{v.wait-=dt;if(v.wait<=0){if(foeNear(v.x,v.y,9))v.wait=2;else unhide(v)}}
    if(!bById.get(v.shelter))unhide(v);return}
  v.threat-=dt;
  if(v.threat<=0){v.threat=.4;if(v.on!=='shelter'&&foeNear(v.x,v.y,6)){goShelter(v);return}}
  switch(v.state){
    case'idle':if(v.wait>0){v.wait-=dt;break}decide(v);break;
    case'walk':if(follow(v,dt,(v.carry.amt?1.9:2.3)*(1+G.age*.04)*(hasT('wheel')?1.15:1)))arrive(v);break;
    case'gather':doGather(v,dt);break;
    case'build':doBuild(v,dt);break;
    case'hold':v.wait-=dt;if(v.wait<=0)v.state='idle';break;
  }
}
function arrive(v){
  switch(v.on){
    case'gather':v.state='gather';v.timer=0;break;
    case'build':v.state='build';break;
    case'drop':{const r=v.carry.res,a=v.carry.amt;if(a){G.res[r]+=a;G.stats.gathered+=a;floater(v.x,v.y,'+'+a,RES[r].c);pulseRes(r);sfx('drop',.25)}v.carry={res:null,amt:0};v.state='idle';v.wait=0;break}
    case'sleep':hide(v,'sleep');break;
    case'shelter':hide(v,'shelter');break;
    case'hold':v.state='hold';v.wait=6;break;
    default:v.state='idle';
  }
  v.on=null;
}
function doGather(v,dt){
  const t=v.tgt;if(!t){v.state='idle';return}
  if(t.k==='node'&&(node[t.i]===0||amt[t.i]===0)||t.k==='farm'&&t.b.dead){v.tgt=null;if(v.carry.amt>=carryMax()*.5)goDeliver(v);else v.state='idle';return}
  const night=isNight();
  if(night&&!litAt(v.x,v.y)){v.keep=t;v.tgt=null;if(v.carry.amt)goDeliver(v);else goHome(v);return}
  v.timer+=dt*.95*G.tools*(1+G.age*.05)*(1+G.toolLvl*.15)*HARD[v.res]*(night?.75:1)*(G.hungry?.5:1)*(v.res==='food'?season().food:1)*(G.rain&&t.k==='node'?.9:1)*(t.k==='farm'&&hasT('agri')?1.2:1)*(hasT('automation')?1.25:1)*(G.buff&&G.buff.work>G.t?1.25:1);
  while(v.timer>=1){v.timer-=1;chips(v.x+v.dir*.3,v.y,RES[v.res].c);if(t.k==='node')sfx('chop',.4);
    if(t.k==='node'){amt[t.i]--;if(amt[t.i]===0)deplete(t.i)}
    v.carry.res=v.res;v.carry.amt++;
    if(v.carry.amt>=carryMax()||(t.k==='node'&&amt[t.i]===0)){v.keep=t;goDeliver(v);return}}
}
function deplete(i){const t=node[i];node[i]=0;const w=season().n==='Winter'?1.8:1;if(t===NI.tree)G.regrow.push({i,t,at:G.t+240*w});else if(t===NI.bush)G.regrow.push({i,t,at:G.t+150*w})}
function doBuild(v,dt){
  const b=v.tgt&&v.tgt.b;if(!b||b.dead||b.done){v.tgt=null;v.prefSite=null;v.state='idle';return}
  if(isNight()&&!litAt(b.x+.5,b.y+.5)){v.tgt=null;goHome(v);return}
  b.prog+=dt*(1+G.age*.1);const mh=bMaxHp(b);b.hp=Math.min(mh,b.hp+mh*.85*dt/b.bt);
  if(b.prog>=b.bt){completeBuilding(b);v.prefSite=null}
}

// ================= MILITARY =================
function tpos(t){
  if(t.kind==='b'){const s=B[t.type].size;return{x:t.x+s/2,y:t.y+s/2,rad:s/2}}
  if(t.kind==='c')return{x:t.x+1,y:t.y+1,rad:1.2};
  return{x:t.x,y:t.y,rad:.25};
}
const isDead=t=>!t||t.dead||t.hidden||(t.kind==='c'&&!t.alive)||(t.kind==='f'&&t.retreat);
function hit(t,dmg){
  if(isDead(t))return;
  t.hp-=dmg;t.flash=.12;if(t.kind==='b'||t.kind==='c')sfx('hit',.15);else sfx('hit',.3);
  if(t.hp>0)return;
  t.dead=true;
  if(t.kind==='b')destroyBuilding(t);
  else if(t.kind==='v'){G.vs=G.vs.filter(x=>x!==t);sel.vs.delete(t.id);notePos=[t.x,t.y];toast(`${t.name} is omgekomen.`,'bad');burst(t.x,t.y,'#b0463a')}
  else if(t.kind==='u'){G.us=G.us.filter(x=>x!==t);sel.us.delete(t.id);burst(t.x,t.y,'#b0463a')}
  else if(t.kind==='f'){G.stats.killed++;burst(t.x,t.y,'#7a3a30');if(Math.random()<.35){const n=5+G.age*3;G.res.food+=n;floater(t.x,t.y,'+'+n,RES.food.c)}}
  else if(t.kind==='c')campDestroyed(t);
}
function destroyBuilding(b){
  const d=B[b.type];b.dead=true;setBlk(b,false);
  for(let dy=0;dy<d.size;dy++)for(let dx=0;dx<d.size;dx++)bmap[(b.y+dy)*W+b.x+dx]=0;
  G.bs=G.bs.filter(x=>x!==b);bById.delete(b.id);if(sel.b===b.id)sel.b=null;
  for(let k=0;k<6;k++)burst(b.x+Math.random()*d.size,b.y+Math.random()*d.size,'#8a7a62');
  for(const v of G.vs)if(v.hidden&&v.shelter===b.id)unhide(v);
  if(SET.shake)shake=d.wall?.15:.5;sfx('boom');
  if(b.type==='townhall'){G.over=true;setTimeout(showGameOver,900)}
  else if(d.wall){note(`${d.n} doorbroken.`,'bad')}else{notePos=[b.x+d.size/2,b.y+d.size/2];toast(`${d.n} is verwoest.`,'bad')}
  uiDirty=true;
}
function campDestroyed(c){
  c.alive=false;G.stats.camps++;
  const L={food:250,wood:200,stone:150},tier=c.tier;
  if(tier>=1){L.copper=80;L.tin=60}if(tier>=2){L.iron=120;L.gold=60}if(tier>=3){L.coal=150;L.steel=60}if(tier>=4){L.oil=150;L.fuel=60}if(tier>=5){L.chips=40;L.battery=40}
  for(const k in L)L[k]=Math.round(L[k]*(1+tier*.6));
  gain(L);
  const ci=((c.y+1)>>4)*CN+((c.x+1)>>4);let extra='';
  if(!G.unl[ci]){G.unl[ci]=1;extra=' Het gebied is nu van jou.'}

  notePos=[c.x+1,c.y+1];toast(`Vijandelijk kamp veroverd! Buit binnengehaald.${extra}`,'good');sfx('age');
  floater(c.x+1,c.y+1,'BUIT','#e2b92c');
  if(sel.camp===c.id)sel.camp=null;
  computeAvail();uiDirty=true;
}
function fire(from,x,y,t,o){
  if(o.laser){hit(t,o.dmg);G.fx.push({type:'beam',x,y,x2:t.x,y2:t.y,life:.12,col:'#5ff0ff'});return}
  if(!o.foe)sfx('shot',.12);const p=tpos(t);G.proj.push({x,y,t,lx:p.x,ly:p.y,dmg:o.dmg,splash:o.splash||0,spd:o.big?11:15,col:o.col||'#fff3c4',foe:!!o.foe,big:!!o.big,h0:o.h0||14});
}
function updateProj(dt){
  for(const p of G.proj){
    if(!isDead(p.t)){const q=tpos(p.t);p.lx=q.x;p.ly=q.y}
    const dx=p.lx-p.x,dy=p.ly-p.y,d=Math.hypot(dx,dy),st=p.spd*dt;
    if(d<=st+.15){p.done=true;
      if(p.splash){const list=p.foe?[...G.vs,...G.us]:G.foes;for(const e of list)if(!e.hidden&&dist(e.x,e.y,p.lx,p.ly)<=p.splash)hit(e,p.dmg);if(p.foe&&!isDead(p.t)&&p.t.kind==='b')hit(p.t,p.dmg);
        if(!p.foe)for(const c of G.camps)if(c.alive&&dist(c.x+1,c.y+1,p.lx,p.ly)<=p.splash+1)hit(c,p.dmg);
        G.fx.push({type:'boom',x:p.lx,y:p.ly,life:.35,r:p.splash})}
      else if(!isDead(p.t))hit(p.t,p.dmg);
    }else{p.x+=dx/d*st;p.y+=dy/d*st}
  }

}
function nearestFoe(x,y,r,air){let best=null,bd=r;for(const f of G.foes){if(f.retreat||f.dead)continue;if(f.air&&!air)continue;const d=dist(x,y,f.x,f.y);if(d<bd){bd=d;best=f}}return best}
function udmg(u){return UNITS[u.k].dmg*armsMul()*(hasT('swarm')&&(u.k==='drone'||u.k==='exo')?1.3:1)}
function uUpdate(u,dt){
  const U=UNITS[u.k],SP=U.spd*(hasT('radio')?1.2:1);u.anim+=dt;if(u.flash)u.flash-=dt;if(u.swing>0)u.swing-=dt;
  u.hp=Math.min(u.mhp,u.hp+dt*((u.order==='guard'&&!u.tgt?1.5:0)+(hasT('medicine')?2:0)));
  if(u.tgt&&isDead(u.tgt)){u.tgt=null;u.path=null;if(u.order==='attack')u.order='guard'}
  u.scan-=dt;
  if(u.scan<=0){u.scan=.4;
    if(!u.tgt||u.order!=='attack'){const st=u.stance||'guard',am=u.order==='amove'||u.order==='patrol',leash=am?8:st==='hold'?U.r+.3:st==='aggr'?11:u.order==='move'?4.5:7;const f=nearestFoe(u.x,u.y,leash,U.air);
      if(f&&(st==='aggr'||u.order!=='guard'||dist(f.x,f.y,u.gx,u.gy)<(st==='hold'?U.r+.5:11)))u.tgt=f;
      else if(u.order==='guard'&&!f&&u.tgt&&dist(u.x,u.y,u.gx,u.gy)>10)u.tgt=null}}
  u.cd-=dt;
  if(u.tgt){
    const p=tpos(u.tgt),d=dist(u.x,u.y,p.x,p.y)-p.rad;
    if(d<=U.r){u.path=null;u.dir=scrX(p.x,p.y)<scrX(u.x,u.y)?-1:1;if(u.stance==='hold'&&u.order!=='attack'){/* stay */}if(u.cd<=0){u.cd=U.rate;u.swing=.2;if(U.proj)fire(u,u.x,u.y,u.tgt,{dmg:udmg(u),splash:U.splash,big:U.big,col:U.fly?'#7ff7ff':U.splash?'#ffbd6b':'#fff3c4',h0:U.fly?22:12});else hit(u.tgt,udmg(u))}}
    else if(u.stance==='hold'&&u.order==='guard'){u.tgt=null}else chase(u,p,dt,SP,U.fly);
    return;
  }
  if(u.order==='move'||u.order==='attack'||u.order==='amove'){if(moveToward(u,u.gx,u.gy,dt,SP,U.fly))u.order='guard';return}
  if(u.order==='patrol'){if(moveToward(u,u.gx,u.gy,dt,SP,U.fly)){const a=u.gx,b2=u.gy;u.gx=u.px;u.gy=u.py;u.px=a;u.py=b2;u.path=null}return}
  if(dist(u.x,u.y,u.gx,u.gy)>.8)moveToward(u,u.gx,u.gy,dt,SP,U.fly);
}
function chase(e,p,dt,spd,fly){
  if(fly){const dx=p.x-e.x,dy=p.y-e.y,d=Math.hypot(dx,dy)||1;e.x+=dx/d*spd*dt;e.y+=dy/d*spd*dt;e.dir=(V2?dx:dx-dy)<0?-1:1;return}
  e.pt-=dt;
  const foe=e.kind==='f',mode=foe?2:true;
  if(!e.path||!e.path.length||e.pt<=0){e.pt=1.5;const pp=findPath(e.x|0,e.y|0,Math.floor(p.x),Math.floor(p.y),mode);
    if(pp===null&&foe){const w=nearestWall(e.x,e.y);if(w&&w!==e.tgt){e.tgt=w;e.rt=6;e.path=findPath(e.x|0,e.y|0,w.x,w.y,2)||[];return}}e.path=pp||[]}
  if(e.path.length)follow(e,dt,spd);else{const dx=p.x-e.x,dy=p.y-e.y,d=Math.hypot(dx,dy)||1;const nx=e.x+dx/d*spd*dt,ny=e.y+dy/d*spd*dt;if((foe?foeWalk:freeWalk)(nx|0,ny|0)){e.x=nx;e.y=ny}}
}
function moveToward(e,x,y,dt,spd,fly){

// ================= EXPANSION / PLACEMENT =================
function chunkCost(){const m=1+G.bought*.55,c={food:Math.round(80*m),wood:Math.round(80*m),stone:Math.round(40*m)};if(G.age>=2)c.gold=Math.round(12*m);if(G.age>=3)c.steel=Math.round(10*m);return c}

// ================= SELECTION / COMMANDS =================
const selVills=()=>G.vs.filter(v=>sel.vs.has(v.id));
const selUnits=()=>G.us.filter(u=>sel.us.has(u.id));
function resetV(v){if(v.hidden){v.hidden=false;const b=bById.get(v.shelter);if(b){v.x=b.x+.5;v.y=b.y+B[b.type].size+.2}}v.tgt=null;v.path=null;v.state='idle';v.wait=0;v.prefSite=null;v.keep=null}
const LIFT=e=>e.kind==='u'?(UNITS[e.k].fly?1:.35):e.kind==='f'?(e.air?1:.35):.35;
const villAt=(X,Y)=>nearScreen(G.vs,X,Y,16,LIFT);
const unitAt=(X,Y)=>nearScreen(G.us,X,Y,16,LIFT);
const foeAt=(X,Y)=>nearScreen(G.foes,X,Y,18,LIFT);

    if(f||c){for(const u of us){u.tgt=f||c;u.order='attack';u.path=null}fxRing(f?f.x:c.x+1,f?f.y:c.y+1,'#c0473b');toast(`${us.length} ${us.length===1?'eenheid valt':'eenheden vallen'} aan.`);did=true}
    else{const n=us.length,cols=Math.ceil(Math.sqrt(n));us.forEach((u,k)=>{u.tgt=null;u.order='move';u.path=null;u.gx=tx+((k%cols)-(cols-1)/2)*.8;u.gy=ty+(Math.floor(k/cols)-(cols-1)/2)*.8});fxRing(tx,ty,'#ffffff');did=true}}

    else if(b&&b.type==='farm'){vs.forEach(v=>{resetV(v);v.job='food';v.keep={k:'farm',b}});toast(`${vs.length} × naar de akker.`);did=true}
    else{const i=iy*W+ix;if(inb(ix,iy)&&nodeVis(i)&&!NODES[node[i]].pump&&isUnl(ix,iy)){const r=NODES[node[i]].res;vs.forEach(v=>{resetV(v);v.job=r;v.keep={k:'node',i}});toast(`${vs.length} × naar ${RES[r].n.toLowerCase()}.`);did=true}

function leftClick(sx,sy,shift){
  const[X,Y]=s2iso(sx,sy),[tx,ty]=s2t(sx,sy),ix=Math.floor(tx),iy=Math.floor(ty);
  if(expandMode){const cx=ix>>4,cy=iy>>4;if(inb(ix,iy)&&canBuyChunk(cx,cy))buyChunk(cx,cy);else toast('Kies een gemarkeerd gebied dat aan je land grenst.');return}
  if(placing){tryPlace(shift);return}
  if(demoMode){const b=bAtScreen(X,Y);if(b&&b.type!=='townhall'){demolish(b);sfx('boom')}else if(inb(ix,iy)&&road[iy*W+ix]){road[iy*W+ix]=0;burst(ix+.5,iy+.5,'#8a7a62');sfx('tick')}else if(b)toast('Het stamhuis kun je niet afbreken.','bad');return}
  if(cmdMode&&sel.us.size){issueOrder(cmdMode,tx,ty);return}
  const u=unitAt(X,Y);if(u){sfx('select');if(!shift)clearSel();sel.vs.clear();sel.b=null;if(sel.us.has(u.id)&&shift)sel.us.delete(u.id);else sel.us.add(u.id);uiDirty=true;return}
  const v=villAt(X,Y);if(v){sfx('select');if(!shift)clearSel();sel.us.clear();sel.b=null;if(sel.vs.has(v.id)&&shift)sel.vs.delete(v.id);else sel.vs.add(v.id);uiDirty=true;return}

let coachTile=null,coachAct=null;
const placed=k=>G.bs.some(b=>b.type===k);
function bestHouse(){return BKEYS.filter(k=>B[k].pop&&k!=='townhall'&&!B[k].nobuild&&B[k].age<=G.age).sort((a,b)=>B[b].age-B[a].age)[0]}
function lackList(nx){const out=[];for(const k in nx.cost)if(G.res[k]<nx.cost[k])out.push(`${fmt(Math.ceil(nx.cost[k]-G.res[k]))} ${RES[k].n.toLowerCase()}`);for(const n of nx.need)if(!built(n))out.push(`een ${B[n].n.toLowerCase()}`);if(popNow()<nx.pop)out.push(`${nx.pop-popNow()} inwoners`);return out}
const andJoin=a=>a.length>2?a.slice(0,2).join(', ')+' en meer':a.length===2?a[0]+' en '+a[1]:a[0]||'';
const bAct=k=>({l:'Bouw '+B[k].n.toLowerCase(),b:k});
function coach(){
  const nx=AGE_UP[G.age+1],NA=nx&&AGES[G.age+1].n.toLowerCase(),pn=popNow(),cap=popCap();
  const raid=G.foes.filter(f=>!f.camp&&!f.retreat).length;
  if(raid)return{t:'Aanval!',h:`${raid} vijanden in je land. Je dorpelingen schuilen. Torens en soldaten verdedigen.`,act:{l:'Bekijk de aanval',k:'alarm'}};
  const lit=G.bs.some(b=>b.type!=='townhall'&&B[b.type].light&&!B[b.type].gen);
  const dark=G.vs.filter(v=>v.state==='sleep'||(v.state==='walk'&&v.on==='sleep')).length;
  if(isNight()&&dark&&!lit&&B.campfire.age<=G.age)return{t:`Het is donker: ${dark} ${dark===1?'dorpeling stopt':'dorpelingen stoppen'} met werken.`,h:'Bij een kampvuur werken ze ’s nachts door. Zet het bij de bomen of akkers.',tile:'campfire',act:bAct('campfire')};
  const hrs=hoursUntilRaid();
  if(!G.peaceful&&hrs!=null&&hrs<7.5){const def=G.bs.some(b=>b.type!=='townhall'&&B[b.type].def);const bar=G.bs.find(b=>b.type==='barracks'&&b.done);
    if(!def&&G.us.length<3){if(bar)return{t:'Vannacht komt een aanval.',h:'Train een paar soldaten in de kazerne, of bouw een toren bij het stamhuis.',act:{l:'Naar de kazerne',k:'sel',id:bar.id}};
      const tw=BKEYS.filter(k=>B[k].def&&B[k].cat==='mil'&&!B[k].nobuild&&B[k].age<=G.age).sort((a,b)=>B[b].age-B[a].age)[0];if(tw)return{t:'Vannacht komt een aanval.',h:`Bouw een ${B[tw].n.toLowerCase()} bij het stamhuis om je dorp te verdedigen.`,tile:tw,act:bAct(tw)}}}
  if(G.age===0){
    if(!placed('hut'))return{t:'Bouw een hut.',h:`Je stam zit vol (${pn}/${cap}). Met een hut is er plek voor nieuwe dorpelingen.`,tile:'hut',act:bAct('hut')};
    if(!placed('farm'))return{t:'Leg een akker aan.',h:'Een akker geeft voedsel dat nooit opraakt.',tile:'farm',act:bAct('farm')};
    if(!placed('storage'))return{t:'Bouw een opslagplaats.',h:'Zet hem bij de bomen: dan lopen je dorpelingen minder ver. Nodig voor de bronstijd.',tile:'storage',act:bAct('storage')};
    if(!placed('campfire'))return{t:'Steek een kampvuur aan.',h:'In het licht werken dorpelingen ook ’s nachts door.',tile:'campfire',act:bAct('campfire')};
    if(!G.peaceful&&!placed('barracks'))return{t:'Bouw een kazerne.',h:'Vanaf de tweede nacht vallen vijanden aan. In de kazerne train je verdedigers.',tile:'barracks',act:bAct('barracks')};
  }
  if(!nx){if(!placed('command'))return{t:'Bouw het commandocentrum.',h:'Daarmee voltooi je je beschaving.',tile:'command',act:bAct('command')};return{t:G.won?'Je beschaving is voltooid.':'Het commandocentrum wordt gebouwd.',h:G.won?'Bouw gerust verder.':'Nog even geduld.'}}
  for(const n of nx.need)if(!placed(n))return{t:`Bouw een ${B[n].n.toLowerCase()}.`,h:`Nodig voor de ${NA}.${B[n].desc?' '+B[n].desc:''}`,tile:n,act:bAct(n)};
  if(pn<nx.pop&&pn>=cap){const h=bestHouse();return{t:`Bouw een ${B[h].n.toLowerCase()}.`,h:`Er is geen plek voor meer inwoners (${pn}/${cap}). De ${NA} vraagt er ${nx.pop}.`,tile:h,act:bAct(h)}}
  for(const k in nx.cost){if(G.res[k]>=nx.cost[k])continue;const left=fmt(Math.ceil(nx.cost[k]-G.res[k]));
    if(GATHER.includes(k)&&!avail[k])return{t:'Breid je gebied uit.',h:`Er ligt nog geen ${RES[k].n.toLowerCase()} binnen je grenzen. Je hebt er nog ${left} nodig.`,act:{l:'Gebied uitbreiden',k:'expand'}};
    if(RES[k].cr){const mk=BKEYS.find(b=>B[b].conv&&B[b].conv.out[k]);if(mk&&!placed(mk))return{t:`Bouw een ${B[mk].n.toLowerCase()}.`,h:`Daar maak je ${RES[k].n.toLowerCase()}, nodig voor de ${NA}.`,tile:mk,act:bAct(mk)};
      if(mk){const inp=Object.keys(B[mk].conv.in).filter(r=>G.res[r]<5);return{t:`Nog ${left} ${RES[k].n.toLowerCase()} nodig.`,h:inp.length?`De ${B[mk].n.toLowerCase()} wacht op ${inp.map(r=>RES[r].n.toLowerCase()).join(' en ')}.`:`De ${B[mk].n.toLowerCase()} maakt het vanzelf.`}}}
  }
  if(pn<nx.pop)return{t:`Je stam groeit: ${pn} van ${nx.pop} inwoners.`,h:G.autoTrain?'Het stamhuis traint vanzelf dorpelingen zolang er voedsel is.':'Train dorpelingen in het stamhuis.'};
  const miss=lackList(nx);if(miss.length)return{t:`Op weg naar de ${NA}.`,h:`Nog ${andJoin(miss)} nodig. Je dorpelingen verzamelen vanzelf.`};
  return{t:`Klaar voor de ${NA}!`,h:'Alles is binnen. Zet de stap naar een nieuw tijdperk.',act:{l:`Naar de ${NA}`,k:'age'}};
}

  openModal(`<button class="quiet x" data-m="pause" aria-label="Terug">×</button><div class="eyebrow">Instellingen</div><h1>Spel en camera</h1>
  <div class="setrow"><div><b>Volume</b><small>Effecten en signalen</small></div><input type="range" id="vol" min="0" max="100" value="${Math.round(SET.vol*100)}" aria-label="Volume"></div>
  <div class="setrow"><div><b>Geluid</b><small>Effecten aan of uit</small></div><button class="tog ${sndOn?'on':''}" data-snd="1" aria-label="Geluid"></button></div>
  <div class="setrow"><div><b>Bovenaanzicht</b><small>Camera recht van boven in plaats van schuin</small></div><button class="tog ${V2?'on':''}" data-view="1" aria-label="Bovenaanzicht"></button></div>
  ${tg('edge','Randscrollen','Kaart schuift als de muis de rand van het scherm raakt')}${tg('hp','Levensbalken altijd tonen','Ook bij gezonde eenheden en gebouwen')}${tg('shake','Schermschudden','Bij instortende gebouwen')}
  <div class="row"><button class="primary" data-m="pause">Terug</button></div>`)}
function showTitle(){const has_=(()=>{try{return!!localStorage.getItem(SKEY)}catch(e){return false}})();let diff=G?G.diff:1;
  const el=$('#title');setSpeed(0);el.hidden=false;document.body.classList.add('titled');const D=[['Vredig','Geen aanvallen. Alleen bouwen.'],['Normaal','Om de nacht een aanval.'],['Zwaar','Elke nacht, grotere groepen.']];
  const draw=()=>{el.innerHTML=`<div class="tw"><div class="tag">Van vuursteen tot drone</div><div class="logo">TIJD<br>PERKEN</div><div class="agesrow">${AGES.map((a,i)=>`<span style="background:${['#d9a441','#d08b3c','#d6705f','#8fb2c9','#a6c25c','#46d3d6'][i]}" title="${a.n}">${a.r}</span>`).join('')}</div>
    <div class="mstack">${has_?`<button class="mbtn primary" data-t="cont"><span>Verder spelen</span><small>${placeName()} · dag ${G.day} · ${AGES[G.age].n}</small></button>`:''}<button class="mbtn ${has_?'':'primary'}" data-t="new"><span>${has_?'Nieuwe wereld':'Begin'}</span><small>${D[diff][0].toLowerCase()}</small></button></div>
    <div><div class="eyebrow" style="margin-bottom:6px">Moeilijkheid</div><div class="diff">${D.map((d,i)=>`<button class="${i===diff?'on':''}" data-d="${i}"><b>${d[0]}</b><small>${d[1]}</small></button>`).join('')}</div></div>
    <div class="mstack"><button class="mbtn" data-t="help"><span>Uitleg</span><small>besturing</small></button><button class="mbtn" data-t="settings"><span>Instellingen</span><small>geluid · camera</small></button></div>
    <div class="tfoot">Zes tijdperken · seizoenen · muren · onderzoek · voortgang wordt in deze browser bewaard</div></div>`};
  draw();el.onclick=e=>{const t=e.target.closest('button');if(!t)return;sfx('tick');
    if(t.dataset.d!==undefined){diff=+t.dataset.d;draw();return}
    if(t.dataset.t==='help'){showHelp();return}if(t.dataset.t==='settings'){showSettings();return}
    if(t.dataset.t==='new'){if(has_||G.t>5){wipe();newGame(undefined,diff)}else{G.diff=diff;G.peaceful=diff===0;Object.assign(G.res,diff===2?{food:150,wood:120,stone:40}:{food:200,wood:160,stone:60})}}
    el.hidden=true;document.body.classList.remove('titled');setSpeed(1)}}
$('#menuBtn').onclick=()=>openPause();
function _oldMenu(){openModal(`<button class="quiet x" data-m="close" aria-label="Sluiten">×</button><div class="eyebrow">${placeName()} · dag ${G.day}</div><h1>Menu</h1>
  <p>${fmt(G.stats.gathered)} grondstoffen verzameld, ${G.stats.killed} vijanden verslagen, ${G.stats.camps} kampen veroverd. Het spel bewaart zichzelf elke minuut in deze browser.</p>
  <label class="check" style="margin-top:16px"><input type="checkbox" id="peace" ${G.peaceful?'checked':''}> Vredige modus: geen aanvallen 's nachts</label>
  <div class="row"><button class="primary" data-m="close">Verder spelen</button><button data-m="save">Opslaan</button><button data-m="load">Laden</button><button data-m="help">Uitleg</button></div>
  <div class="row"><button class="quiet danger-t" data-m="new">↺ Nieuwe wereld beginnen</button></div>`)}
function showHelp(){openModal(`<button class="quiet x" data-m="close" aria-label="Sluiten">×</button><div class="eyebrow">Welkom in ${placeName()}</div><h1>Bouw. Groei. Overleef.</h1>
  <p>Leid je stam van de <b>steentijd</b> naar het <b>dronetijdperk</b>, in zes hoofdstukken. Elk tijdperk onthult nieuwe grondstoffen op de kaart: koper en tin, ijzer en goud, kolen, olie en zand, en tot slot lithium.</p>
  <p>Je <b>dorpelingen</b> werken vanzelf op wat het hardst nodig is. Wil je regie, geef ze dan een vaste taak in het paneel Volk, of selecteer ze en klik op een boom, ader of bouwplaats.</p>
  <p>'s <b>Nachts</b> gaan dorpelingen buiten het licht naar huis. Elke tweede nacht vallen vijanden aan. Bouw torens, train een <b>leger</b> en verover de kampen op de kaart voor buit en grond.</p>
  <p><b>Muren</b> houden vijanden echt tegen: ze moeten erdoorheen hakken. Bouw een <b>poort</b> zodat je eigen volk erdoor kan. <b>Wegen</b> laten iedereen sneller lopen. In het paneel <b>Onderzoek</b> doe je uitvindingen per tijdperk, en soms vraagt een <b>gebeurtenis</b> om een keuze.</p>
  <p>Elk nieuw tijdperk ontgrendelt <b>verbeteringen</b> voor wat je al hebt: gebouwen gaan een niveau omhoog, je volk krijgt betere werktuigen en je leger beter pantser. Een pijltje boven een gebouw betekent dat er een verbetering klaarstaat.</p>
  <div class="keys"><kbd>Slepen</kbd><span>Kaart verschuiven · scroll om te zoomen</span><kbd>Klik</kbd><span>Bekijken en selecteren</span><kbd>Shift + slepen</kbd><span>Groep selecteren</span><kbd>Rechtsklik</kbd><span>Opdracht: lopen, aanvallen, verzamelen</span><kbd>Q · I</kbd><span>Hele leger · stilstaande dorpelingen</span><kbd>E</kbd><span>Gebied uitbreiden</span><kbd>V</kbd><span>Bovenaanzicht aan of uit</span><kbd>Spatie · [ ]</kbd><span>Pauze · langzamer / sneller</span><kbd>1 – 9</kbd><span>Gebouw uit de bouwbalk kiezen</span><kbd>Ctrl+F1 – F5 · F1 – F5</kbd><span>Groep instellen · groep selecteren (twee keer: ernaartoe)</span><kbd>S · F · R</kbd><span>Leger: stop · aanvalsmars · patrouille</span><kbd>Shift-klik trainen</kbd><span>Vijf eenheden tegelijk in de wachtrij</span><kbd>Slepen bij muur of weg</kbd><span>Hele lijn in één keer bouwen</span><kbd>Delete</kbd><span>Sloopmodus (of: geselecteerd gebouw afbreken)</span><kbd>Z X C B</kbd><span>Bouwcategorie wisselen</span><kbd>P · M</kbd><span>Paneel · geluid</span><kbd>Esc</kbd><span>Annuleren</span></div>
  <div class="row"><button class="primary" data-m="close">Op avontuur →</button></div>`)}
function showVictory(){openModal(`<div class="eyebrow">Hoofdstuk VI voltooid</div><h1>Van vuursteen tot drone.</h1><p>${placeName()} doorliep de hele geschiedenis in ${G.day} dagen. ${fmt(G.stats.gathered)} grondstoffen verzameld, ${G.stats.killed} vijanden verslagen, ${G.stats.camps} kampen veroverd.</p><div class="row"><button class="primary" data-m="close">Verder bouwen</button><button data-m="new">Nieuwe wereld</button></div>`)}
function showGameOver(){openModal(`<div class="eyebrow">Dag ${G.day}</div><h1>Het stamhuis is gevallen.</h1><p>${placeName()} hield ${G.day} dagen stand en bereikte de ${AGES[G.age].n.toLowerCase()}. Bouw volgende keer eerder torens en een leger, of speel in de vredige modus.</p><div class="row"><button class="primary" data-m="newok">Nieuwe wereld</button></div>`)}

// ================= SAVE / LOAD =================
const SKEY='tijdperken-save-v3';
function b64(u8){let s='';for(let i=0;i<u8.length;i+=0x8000)s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));return btoa(s)}
function ub64(b){const s=atob(b),u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u}
function serialize(){
  const g={};for(const k of['age','res','t','clock','day','unl','raids','tools','carryCap','autoTrain','peaceful','won','bought','stats','nid','trainQ','log','toolLvl','armsLvl','rain','groups','hist','stance','diff','tech','research','buff','forceRaid','lastEvent'])g[k]=G[k];
  return JSON.stringify({v:3,seed:G.seed,g,road:b64(road),node:b64(node),amt:b64(new Uint8Array(amt.buffer)),
    bs:G.bs.map(b=>({id:b.id,type:b.type,lvl:b.lvl||0,x:b.x,y:b.y,hp:b.hp,done:b.done,prog:b.prog,bt:b.bt,on:b.on,q:b.q,rally:b.rally})),
    vs:G.vs.map(v=>({x:v.x,y:v.y,name:v.name,job:v.job,hp:v.hp})),us:G.us.map(u=>({k:u.k,x:u.x,y:u.y,hp:u.hp,st:u.stance||'guard',id:u.id})),
    camps:G.camps.map(c=>({id:c.id,x:c.x,y:c.y,tier:c.tier,hp:c.hp,mhp:c.mhp,alive:c.alive})),
    guards:G.foes.filter(f=>f.camp).map(f=>({type:f.type,x:f.x,y:f.y,hp:f.hp,mhp:f.mhp,camp:f.camp})),cam:{x:cam.x,y:cam.y,z:cam.z},cv:2});
}
function deserialize(str){
  const s=JSON.parse(str);if(s.v!==3)return false;
  G=baseState(s.seed);genWorld(s.seed);Object.assign(G,s.g);G.groups=G.groups||{};G.hist=G.hist||[];G.offer=null;G.stats=Object.assign(baseState(0).stats,s.g.stats);G.log=s.g.log||[];G.toolLvl=s.g.toolLvl||0;G.armsLvl=s.g.armsLvl||0;G.tech=G.tech||{};G.buff=G.buff||{};G.diff=G.diff==null?1:G.diff;G.event=null;if(s.road)road.set(ub64(s.road));
  node.set(ub64(s.node));amt.set(new Uint16Array(ub64(s.amt).buffer));buildLists();bById.clear();
  for(const o of s.bs){const d=B[o.type];const b={...o,kind:'b',cd:0,ct:0,gt:d.gen?d.gen.t:0,run:false,qt:0,act:0,q:o.q||[]};G.bs.push(b);bById.set(b.id,b);for(let dy=0;dy<d.size;dy++)for(let dx=0;dx<d.size;dx++)bmap[(b.y+dy)*W+b.x+dx]=b.id;if(b.done)setBlk(b,true)}
  for(const o of s.vs){const v=spawnVillager(o.x,o.y);v.name=o.name;v.job=o.job;v.hp=o.hp}
  for(const o of s.us){const u=spawnUnit(o.k,o.x,o.y);u.hp=o.hp;u.stance=o.st||'guard';if(o.id)u.id=o.id}
  G.camps=s.camps.map(c=>({...c,kind:'c'}));for(const o of s.guards){const c=G.camps.find(c=>c.id===o.camp);if(!c)continue;const f=spawnFoe(o.type,o.x,o.y,1,c);f.hp=o.hp;f.mhp=o.mhp;f.hx=c.x+1+(Math.random()-.5)*3;f.hy=c.y+1+(Math.random()-.5)*3}
  if(s.cam){let x=s.cam.x,y=s.cam.y;if(s.cv!==2){const X=x,Y=y;x=(X/TW+Y/TH)/2;y=(Y/TH-X/TW)/2;if(!(x>=0&&x<=W&&y>=0&&y<=H)){x=64;y=64}}cam.x=x;cam.y=y;cam.z=s.cam.z||1;clampCam()}
  clearSel();afterLoad();return true;
}
function save(manual){try{localStorage.setItem(SKEY,serialize());$('#saved').lastChild.textContent=`Opgeslagen op dag ${G.day}`;if(manual)toast('Spel opgeslagen.','good')}catch(e){$('#saved').lastChild.textContent='Opslaan lukt niet in deze browser';if(manual)toast('Opslaan lukt niet in deze browser.','bad')}}
function load(){try{const s=localStorage.getItem(SKEY);if(!s)return false;return deserialize(s)}catch(e){return false}}
function wipe(){try{localStorage.removeItem(SKEY)}catch(e){}}
function afterLoad(){computeCaches();computeAvail();onAgeChange();setSpeed(1);setZoom(cam.z);for(const k in sigs)sigs[k]=null;uiDirty=true}
addEventListener('visibilitychange',()=>{if(document.hidden&&G&&!G.over)save()});

// ================= LOOP =================
let lastT=performance.now(),acc=0,uiT=0,miniT=0,saveT=0;const edge={x:-1,y:-1};
addEventListener('mousemove',e=>{edge.x=e.clientX;edge.y=e.clientY});document.addEventListener('mouseleave',()=>{edge.x=-1});addEventListener('blur',()=>{edge.x=-1});
function frame(now){
  const rdt=Math.min(.1,(now-lastT)/1000);lastT=now;
  if($('#modal').hidden){const pp=900*rdt;let kx=0,ky=0;if(keys.has('w')||keys.has('arrowup'))ky-=1;if(keys.has('s')&&!sel.us.size||keys.has('arrowdown'))ky+=1;if(keys.has('a')||keys.has('arrowleft'))kx+=1;if(keys.has('d')||keys.has('arrowright'))kx-=1;
    if(SET.edge&&edge.x>=0&&!drag&&!mouse.touch&&$('#title').hidden){const m=10;if(edge.x<m)kx+=1;else if(edge.x>innerWidth-m)kx-=1;if(edge.y<m)ky-=1;else if(edge.y>innerHeight-m)ky+=1}
    if(kx||ky)panScreen(kx*pp,ky*pp)}
  if(!$('#title').hidden){cam.x+=Math.cos(now/9000)*.4*rdt;cam.y+=Math.sin(now/7000)*.3*rdt;clampCam()}
  if(cam.tx!=null){const k=1-Math.pow(.002,rdt);cam.x+=(cam.tx-cam.x)*k;cam.y+=(cam.ty-cam.y)*k;if(Math.abs(cam.tx-cam.x)<.02&&Math.abs(cam.ty-cam.y)<.02)cam.tx=null}
  if(shake>0)shake=Math.max(0,shake-rdt);
  if(G.speed&&!G.over){acc+=rdt*G.speed;let n=0;while(acc>=1/30&&n<16){update(1/30);acc-=1/30;n++}if(n>=16)acc=0}
  render();updateHover();
  uiT-=rdt;if(uiT<=0||uiDirty){uiT=.25;uiDirty=false;if(curAge!==G.age)onAgeChange();updateHeader();updateWorldTop();renderChronicle();renderUpgrades();renderJobs();renderDefense();renderLog();renderInspector();renderCmd()}
  miniT-=rdt;if(miniT<=0){miniT=.4;renderMini()}
  rateT-=rdt;if(rateT<=0){rateT=5;if(rateSnap){const gt=G.t-rateSnap.t;if(gt>0)for(const k of RKEYS){const r=(G.res[k]-rateSnap.r[k])/gt*60;rate[k]=rate[k]===undefined?r:rate[k]*.6+r*.4}}rateSnap={t:G.t,r:{...G.res}}}
  saveT+=rdt;if(saveT>60){saveT=0;if(!G.over)save()}
  requestAnimationFrame(frame);
}
function measureHud(){const ds=document.documentElement.style,w=worldEl.getBoundingClientRect();
  if(innerWidth<=900){const bt=Math.max(...['#ageplate','#resPanel','#objectives'].map(s=>$(s).getBoundingClientRect().bottom));ds.setProperty('--topH',Math.round(bt-w.top)+'px');ds.setProperty('--barH',$('#bar').offsetHeight+'px')}else{ds.removeProperty('--topH');ds.removeProperty('--barH')}}
try{const ro=new ResizeObserver(measureHud);for(const s of['#ageplate','#resPanel','#objectives','#bar'])ro.observe($(s))}catch(e){addEventListener('resize',measureHud)}
function start(data){
  resize();try{if(localStorage.getItem('tijdperken-view')==='2d')V2=true}catch(e){}document.body.classList.toggle('v2',V2);
  let ok=false;if(data&&data.save){try{ok=deserialize(data.save)}catch(e){ok=false}}
  const fromHot=ok;if(!ok)ok=load();
  if(!ok)newGame();
  if(!fromHot)showTitle();
  measureHud();requestAnimationFrame(frame);
}
const hot=window.claude&&window.claude.hot;
if(hot&&hot.snapshot)try{hot.snapshot(()=>({save:G?serialize():null}))}catch(e){}
if(hot&&hot.ready)hot.ready(start);else start(hot&&hot.data||{});
})();
</script>
