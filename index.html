<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>Tijdperken – bouw je stam van de steentijd naar de sterren</title>
    <meta
      name="description"
      content="Een real-time strategiespel in de browser: leid je stam door negen tijdperken, van hut tot sterrenpoort. Bouw, verzamel, verdedig je dorp tegen nachtelijke aanvallen en speel met of tegen rivalen. Gratis, zonder installatie, op pc en telefoon."
    />
    <meta name="theme-color" content="#2b2520" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Tijdperken" />
    <meta
      property="og:description"
      content="Leid je stam van de steentijd naar het sterrentijdperk. Een strategiespel van 25 minuten tot uren, in je browser."
    />
    <meta name="twitter:card" content="summary" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2032%2032%22%3E%3Crect%20width%3D%2232%22%20height%3D%2232%22%20rx%3D%226%22%20fill%3D%22%23f4ecda%22/%3E%3Cpath%20d%3D%22M16%205%2027%2026H5Z%22%20fill%3D%22%232b2520%22/%3E%3Cpath%20d%3D%22M16%2013%2021%2023H11Z%22%20fill%3D%22%23c08a3e%22/%3E%3C/svg%3E"
      type="image/svg+xml"
    />
    <meta name="claude:viewport-fit-sides" content="cover" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,400..900,0..100,0..1;1,9..144,400..900,0..100,0..1&family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
    />
  </head>
  <body>
    <div id="app" lang="nl">
      <section id="world">
        <canvas id="cv" tabindex="0" aria-label="Spelwereld"></canvas>
        <canvas id="ov" aria-hidden="true"></canvas>
        <div id="raidflash"></div>
        <div id="screenfx"></div>
        <div id="top">
          <div id="ageplate" class="hud">
            <div class="day">
              <canvas id="dial" width="68" height="68"></canvas>
              <div><b id="dayTxt">Dag 1</b><small id="timeTxt">07:00</small></div>
            </div>
            <div class="age" title="Huidig tijdperk">
              <b id="ageNum">I</b><small id="locEyebrow">Steentijd</small>
              <ol class="tl" id="ageLine"></ol>
            </div>
            <!-- Knoppen met data-ico krijgen bij het opstarten hun pictogram (zie ui/hud.ts) -->
            <div class="speed" id="speed" role="group" aria-label="Spelsnelheid">
              <button data-s="0" data-ico="⏸" aria-label="Pauze" title="Pauze (spatie)"></button
              ><button
                data-s="1"
                data-ico="▶"
                class="on"
                aria-label="Normale snelheid"
                title="Normale snelheid"
              ></button
              ><button
                data-s="2"
                data-ico="⏩"
                aria-label="Dubbele snelheid"
                title="Twee keer zo snel"
              ></button
              ><button
                data-s="4"
                data-ico="⏭"
                aria-label="Viervoudige snelheid"
                title="Vier keer zo snel"
                hidden
              ></button>
            </div>
          </div>
          <section id="resPanel" class="hud" aria-label="Grondstoffen">
            <div class="poprow">
              <div class="pstat" id="popStat" title="Inwoners en plek in woningen">
                <i
                  ><svg
                    class="ico"
                    viewBox="0 0 24 24"
                    aria-hidden="true"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <path d="M4 11l8-7 8 7" />
                    <path d="M6 9.5V20h12V9.5" />
                    <path d="M10 20v-5h4v5" /></svg></i
                ><b>5/5</b>
              </div>
              <div class="pstat" id="powStat" hidden title="Stroom: geleverd / nodig">
                <i
                  ><svg
                    class="ico"
                    viewBox="0 0 24 24"
                    aria-hidden="true"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <path d="M13 3L5 13h6l-1 8 8-10h-6z" /></svg></i
                ><b>0/0</b>
              </div>
              <span id="quick"></span>
            </div>
            <div id="resbar"></div>
          </section>
          <section id="objectives" class="hud" aria-label="Doelen">
            <!-- De volgende stap in één regel; klik erop voor de uitleg -->
            <div id="step">
              <button id="stepTxt" aria-expanded="false" title="Volgende stap · klik voor uitleg">
                <b id="modeTxt"></b><i class="caret" aria-hidden="true"></i>
              </button>
              <p id="modeHint"></p>
              <button class="primary" id="coachBtn" hidden></button>
            </div>
            <div id="mission"></div>
          </section>
          <!-- Tijdelijke bonussen en vervolgen die nog komen: kleine ronde plaatjes (zie ui/event.ts) -->
          <div id="buffs" hidden></div>
        </div>
        <div id="topright">
          <button id="menuBtn" class="hud" data-ico="☰" aria-label="Menu" title="Menu (Esc)">
            <span class="lbl">Menu</span>
          </button>
        </div>
        <div id="resPop" class="hud" hidden></div>
        <!-- Boven in het midden: eerst wat blijft staan (balken, een gebeurtenis, een aanbod), daaronder wat
             vanzelf weer weggaat (een prestatie en de meldingen). Zo verspringt een kaartje niet. -->
        <div id="notes">
          <div id="topbars"></div>
          <div id="event" class="hud" hidden></div>
          <div id="offer" class="hud" hidden></div>
          <div id="toast" role="status" aria-live="polite"></div>
        </div>
        <!-- Panelen: een pictogram met de naam ernaast (op een telefoon alleen het pictogram) -->
        <nav id="sidebtns" aria-label="Panelen">
          <button data-p="pop" data-ico="⚇" aria-label="Dorp"><span class="lbl">Dorp</span><i></i></button
          ><button data-p="def" data-ico="⚔" aria-label="Leger" hidden>
            <span class="lbl">Leger</span><i></i></button
          ><button data-p="upg" data-ico="▲" aria-label="Verbeteren" hidden>
            <span class="lbl">Verbeteren</span><i></i></button
          ><button data-p="log" data-ico="≣" aria-label="Logboek" hidden>
            <span class="lbl">Logboek</span><i></i></button
          ><button data-p="goal" data-ico="◎" aria-label="Doel" class="mob">
            <span class="lbl">Doel</span><i></i></button
          ><button data-p="map" data-ico="◫" aria-label="Kaart" class="mob">
            <span class="lbl">Kaart</span><i></i>
          </button>
        </nav>
        <section id="panel" class="hud" hidden>
          <div class="ph">
            <b id="panelTitle">Dorp</b
            ><button
              class="quiet x"
              id="panelClose"
              data-ico="✕"
              aria-label="Sluiten"
              title="Sluiten"
            ></button>
          </div>
          <div class="pbody">
            <div class="pane" data-pane="pop">
              <div class="sect">Bevolking <span id="popSect"></span></div>
              <div id="jobs"></div>
            </div>
            <div class="pane" data-pane="def">
              <div class="sect">Verdediging <span id="defSect"></span></div>
              <div id="defense"></div>
              <div class="sect" id="rivSect" hidden>
                Rivalen <span id="rivLeft"></span>
                <button class="sectbtn" id="diploBtn" title="Geschenken, handel, verbonden, oorlog en vrede">
                  Diplomatie ›
                </button>
              </div>
              <div id="rivals" hidden></div>
            </div>
            <div class="pane" data-pane="upg">
              <div id="upgrades"></div>
            </div>
            <div class="pane" data-pane="log">
              <div class="sect">Voorraad <span>laatste 10 min</span></div>
              <canvas
                id="chart"
                width="480"
                height="120"
                style="
                  width: 100%;
                  height: 60px;
                  display: block;
                  margin-bottom: 12px;
                  border-radius: 10px;
                  background: var(--well);
                "
              ></canvas>
              <div class="sect">Veldnotities <span>Live</span></div>
              <div class="log" id="log"></div>
              <div class="saved" id="saved">
                <i class="gem" style="--c: var(--faint)"></i>Voortgang wordt in deze browser bewaard
              </div>
            </div>
          </div>
        </section>
        <div id="hintbar" class="hud" hidden>
          <i class="dot" id="modeDot"></i><b id="hintTxt"></b><span id="hintSub"></span
          ><button
            class="quiet x"
            id="cancelBtn"
            data-ico="✕"
            aria-label="Annuleren"
            title="Annuleren (Esc)"
          ></button>
        </div>
        <footer id="bar">
          <section id="selPanel" class="hud" aria-label="Selectie"><div id="inspector"></div></section>
          <section id="cmdPanel" class="hud" aria-label="Opdrachten">
            <div class="cats" id="cats" role="tablist"></div>
            <div id="cmdgrid"></div>
          </section>
          <section id="mapPanel" class="hud" aria-label="Kaart">
            <div id="miniBox">
              <canvas id="mini" width="344" height="344" aria-label="Overzichtskaart"></canvas>
              <!-- Aanzicht: bovenaanzicht (2D) of 3D; in 3D kun je draaien, het kompas zet de draaiing terug -->
              <div class="viewseg" role="group" aria-label="Aanzicht">
                <button id="view2d" aria-pressed="false" title="Bovenaanzicht (V)">2D</button
                ><button id="view3d" aria-pressed="true" title="3D-aanzicht (V)">3D</button>
              </div>
              <button
                id="compass"
                class="mmb"
                aria-label="Draaiing terugzetten"
                title="Noorden · klik om de draaiing terug te zetten"
              >
                <svg class="needle" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M12 2.5l4.2 9.5H7.8z" fill="#d1493c" />
                  <path d="M12 21.5L7.8 12h8.4z" fill="currentColor" opacity="0.45" />
                </svg>
              </button>
              <!-- Grote kaart (alleen op een groot scherm): dezelfde kaart groot in het midden -->
              <button
                id="mapBig"
                class="mmb"
                aria-pressed="false"
                aria-label="Grote kaart"
                title="Grote kaart"
              >
                <svg
                  class="ico"
                  viewBox="0 0 24 24"
                  aria-hidden="true"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2.2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="M4 9V4h5" />
                  <path d="M20 9V4h-5" />
                  <path d="M4 15v5h5" />
                  <path d="M20 15v5h-5" />
                </svg>
              </button>
              <button id="rotL" class="mmb" aria-label="Draai linksom" title="Draai linksom (,)">
                <svg
                  class="ico"
                  viewBox="0 0 24 24"
                  aria-hidden="true"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2.2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="M3 4v6h6" />
                  <path d="M3.5 15a9 9 0 1 0 2.1-9.4L3 10" />
                </svg>
              </button>
              <button id="rotR" class="mmb" aria-label="Draai rechtsom" title="Draai rechtsom (.)">
                <svg
                  class="ico"
                  viewBox="0 0 24 24"
                  aria-hidden="true"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2.2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="M21 4v6h-6" />
                  <path d="M20.5 15a9 9 0 1 1-2.1-9.4L21 10" />
                </svg>
              </button>
            </div>
            <div class="mapbtns">
              <button id="zOut" aria-label="Uitzoomen" title="Uitzoomen">−</button
              ><button id="zIn" aria-label="Inzoomen" title="Inzoomen">+</button
              ><button id="zHome" aria-label="Naar het stamhuis" title="Naar het stamhuis">
                <svg
                  class="ico"
                  viewBox="0 0 24 24"
                  aria-hidden="true"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="M4 11l8-7 8 7" />
                  <path d="M6 9.5V20h12V9.5" />
                  <path d="M10 20v-5h4v5" />
                </svg></button
              ><button id="expandBtn" data-ico="⬚" title="Gebied uitbreiden"><span>Uitbreiden</span></button>
            </div>
          </section>
        </footer>
        <div id="hovertip" hidden></div>
        <div id="banner" hidden></div>
      </section>
    </div>
    <div id="title" hidden></div>
    <div id="modal" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
